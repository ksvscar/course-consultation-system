<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>課程諮詢紀錄表 - 簽名測試</title>
<style>
  :root{
    --ink:#152238;
    --steel:#1E3A5F;
    --steel-deep:#0F2540;
    --steel-pale:#E8EEF5;
    --line:#D7E0EA;
    --signal:#FF5A1F;
    --signal-dim:#FFE7DB;
    --paper:#FBFAF7;
    --ok:#1E7A4C;
    --font-cjk: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;

    /* ============================================
       v15 新增、v17 調整：全域響應式字體標準
       ------------------------------------------------
       手機和平板共用同一套 clamp() 公式，隨裝置視窗寬度
       自動放大字體，不需要為每個裝置額外寫 media query。
       這是「之後頁面表單設計都要用響應式設計」的基礎規格，
       未來新頁面的內文文字應優先沿用這幾個變數，
       確保全站字體大小一致。

       v17：手機基準固定在 21px（Ethen 確認這個大小最好讀），
       純 vw 係數公式讓中大型平板（例如 iPad Air 13 吋，CSS
       邏輯寬度約 1024px 直式 / 1366px 橫式）能繼續平滑放大，
       不會卡在手機大小不動，也不會需要等轉橫式才有感覺。
       ============================================ */
    --fs-body: clamp(21px, 2.8vw, 32px);         /* 一般說明文字（警示卡、通知卡內文）*/
    --fs-body-strong: clamp(22px, 3vw, 34px);    /* 同一區塊內的粗體/標題行，比內文大一階 */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--steel-deep);font-family:var(--font-cjk);color:var(--ink);}
  /* ============================================
     v18 修正 Bug3：停用長按觸發的瀏覽器選取文字選單
     ------------------------------------------------
     iOS/Android 瀏覽器長按畫面會跳出「拷貝/搜尋/翻譯」選單
     （原生文字選取功能），簽名時手指在畫布上稍微停留或拖曳
     容易誤觸發，跳出的黑色工具列還會暫時擋住簽名區。
     這裡全站停用文字選取與長按選單（-webkit-touch-callout
     專門對付 iOS Safari 的長按放大鏡/選單），簽名操作不再
     受影響，且此為整份表單皆適用的操作型網頁，不需要文字選取。
     ============================================ */
  *{
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    background:
      radial-gradient(circle at 20% -10%, #2A4C74 0%, transparent 45%),
      var(--steel-deep);
  }
  .device{
    width:100%;
    max-width: clamp(360px, 92vw, 820px);
    min-height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 60px rgba(0,0,0,.4);
  }

  header{
    background:linear-gradient(135deg, var(--steel-deep), var(--steel) 70%);
    color:#fff;
    padding:20px 20px 22px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; right:-30px; top:-30px;
    width:160px; height:160px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.08);
  }
  header::before{
    content:"";
    position:absolute; right:10px; top:40px;
    width:100px; height:100px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.06);
  }
  .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:#9FC1E0; font-weight:600; margin:0 0 4px; position:relative;
  }
  h1{
    font-size:19px; margin:0 0 14px; font-weight:700; line-height:1.4;
    position:relative;
  }
  .gauge-track{
    display:flex; gap:5px; position:relative;
  }
  .gauge-track i{
    flex:1; height:4px; border-radius:2px;
    background:rgba(255,255,255,.18);
    overflow:hidden;
  }
  .gauge-track i span{
    display:block; height:100%; width:0%;
    background:var(--signal);
    transition:width .4s ease;
  }
  .gauge-track i.done span{width:100%;}
  .gauge-track i.active span{width:55%;}
  .step-label{
    margin-top:8px; font-size:16px; color:#C9DCEE; letter-spacing:.02em; position:relative; /* v20：放大二級(12px->16px) */
  }
  .step-label b{color:#fff;}

  main{flex:1; padding:22px 20px 110px; overflow-y:auto;}

  .card{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:20px 18px; margin-bottom:16px;
  }

  .name-summary{
    font-size:var(--fs-body-strong); font-weight:700; color:var(--steel-deep); margin:0;
  }

  .warn-card{
    display:flex; gap:10px;
    background:var(--signal-dim); border:1px solid #FFCBB0; border-radius:12px;
    padding:14px 14px; margin-bottom:16px;
  }
  .warn-card .ic{
    width:26px; height:26px; border-radius:50%; background:var(--signal);
    color:#fff; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700;
  }
  .warn-card .txt{font-size:var(--fs-body); color:#7A3A1E; line-height:1.6;}
  .warn-card .txt b{color:var(--steel-deep); display:block; margin-bottom:2px; font-size:var(--fs-body-strong);}
  .warn-card a{color:var(--steel); font-weight:700; text-decoration:none;}

  .sig-wrap{background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px;}

  .sig-label{
    font-size:var(--fs-body-strong); font-weight:700; color:var(--steel-deep);
    margin:0 0 4px; display:flex; justify-content:space-between; align-items:center;
  }
  .sig-hint{
    font-size:var(--fs-body); color:var(--signal); margin:0 0 12px; font-weight:700;
    display:none; /* 只在鎖定時顯示，由 JS 控制 */
  }
  .expand-btn{
    display:flex; align-items:center; gap:5px;
    background:#fff; border:1.5px solid var(--signal); color:var(--signal);
    border-radius:999px; padding:6px 12px; font-size:var(--fs-body); font-weight:700;
    cursor:pointer; transition:.15s;
    flex-shrink:0;
  }
  .expand-btn:hover{background:var(--signal-dim);}

  .sig-canvas-container{
    position:relative;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:var(--steel-pale);
    overflow:hidden;
    margin-bottom:12px;
    aspect-ratio: 16 / 9;
    display:flex; align-items:center; justify-content:center;
  }

  /* ============================================
     v11：小畫布狀態由 JS 動態切換
     - 解鎖（可手寫）：touch-action:none（避免手寫時觸發頁面捲動）
     - 鎖定（純預覽）：pointer-events:none（觸控直接穿透給頁面捲動）
     預設先給解鎖狀態的樣式，實際狀態由 setSmallCanvasLocked() 控制
     ============================================ */
  #signatureCanvas{
    width:100%; height:100%; display:block;
    touch-action:none;
    cursor:crosshair;
  }

  .btn-clear{
    width:100%;
    padding:11px; border-radius:10px; border:1.5px solid var(--line);
    background:#fff; color:#5C6C81; font-size:var(--fs-body); font-weight:700;
    font-family:var(--font-cjk); cursor:pointer; transition:.15s;
  }
  .btn-clear:hover{background:var(--steel-pale);}

  /* ============================================
     v13 修正 Bug3、v18 加強對比：通知文字高亮樣式
     「先不要關閉視窗」改用高對比亮黃色凸顯，不再只靠底線
     ============================================ */
  .notice-card{
    background:var(--signal); border:none; border-radius:12px;
    padding:14px 16px; margin-top:16px; font-size:var(--fs-body); color:#fff;
    line-height:1.7; font-weight:700;
    box-shadow:0 4px 12px rgba(255,90,31,.25);
  }
  .notice-card b{
    color:#fff; /* v20：藍色仍不夠明顯，改回白色，用粗體+底線加強對比 */
    font-weight:900;
    text-decoration:underline; text-underline-offset:3px;
  }

  /* ============================================
     v18 全域規則：底部主要操作列（上一步／下一步 /
     送出紀錄表 等固定式導覽按鈕）字體固定不隨裝置放大，
     跟表單內文（會用 --fs-body 響應式放大）區隔開來。
     這是往後所有頁面的統一設定：導覽列固定、內容區動態。
     ============================================ */
  .cta-bar{
    position:sticky; left:0; right:0; bottom:0;
    background:linear-gradient(0deg, var(--paper) 60%, rgba(251,250,247,0));
    padding:16px 20px 16px; display:flex; gap:8px;
  }
  .btn{
    flex:1; padding:11px; border-radius:10px; border:none;
    font-size:18px; font-weight:700; font-family:var(--font-cjk); cursor:pointer; /* 固定字體，不響應式，v19放大二級(14px->18px) */
  }
  .btn-prev{background:#fff; border:1.5px solid var(--line); color:#5C6C81; flex:0 0 78px;}
  .btn-next{
    background:var(--signal); color:#fff;
    box-shadow:0 6px 14px rgba(255,90,31,.3);
  }
  .btn-next:active{transform:translateY(1px);}
  .btn-next:disabled{opacity:.6; cursor:not-allowed;}

  /* ============================================
     v13 修正 Bug2：手機橫式時底部按鈕列太高，
     壓縮簽名版可視空間。僅在「橫式 + 螢幕高度較矮」
     （手機特徵）時縮小，iPad/平板螢幕高度較高不受影響。
     ============================================ */
  @media (orientation: landscape) and (max-height: 500px) {
    main{ padding-bottom: 60px; }
    .cta-bar{ padding:6px 16px 6px; gap:6px; }
    .btn{ padding:6px; font-size:15px; }
    .btn-prev{ flex:0 0 56px; }
  }

  /* ============================================
     v13 新增、v15 改為響應式 Bug2：送出結果通知彈窗
     ------------------------------------------------
     版幅、圖示、文字都改用 clamp()，隨裝置視窗寬度自動放大，
     手機維持接近原本大小，平板（iPad）會明顯放大，
     不需要另外寫 media query 分開處理。
     ============================================ */
  .complete-modal{
    display:none;
    position:fixed; inset:0;
    background:rgba(15,37,64,.55);
    z-index:20000;
    align-items:center; justify-content:center;
    padding:20px;
  }
  .complete-modal.active{display:flex;}
  .complete-box{
    background:#fff; border-radius:16px;
    padding:clamp(24px,5vw,44px) clamp(20px,5vw,36px) clamp(20px,4vw,32px);
    max-width:clamp(300px, 55vw, 560px); width:100%; text-align:center; position:relative;
    box-shadow:0 20px 50px rgba(0,0,0,.3);
  }
  .complete-close-btn{
    position:absolute; top:10px; right:10px;
    width:clamp(30px,4vw,44px); height:clamp(30px,4vw,44px); border-radius:50%;
    border:none; background:var(--steel-pale); color:var(--steel-deep);
    font-size:clamp(14px,2.2vw,22px); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .complete-close-btn:hover{background:var(--line);}
  .complete-icon{
    width:clamp(56px,9vw,96px); height:clamp(56px,9vw,96px); border-radius:50%;
    background:#2563EB; /* v16：可關閉頁面（成功）圖示改藍底，原本綠底 */
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(26px,4.5vw,44px); margin:0 auto clamp(12px,2vw,20px);
  }
  .complete-icon.is-reject{ background:#DC2626; } /* v16：簽名不清楚（退件）圖示改紅底，原本橙底 */
  .complete-text{ font-size:clamp(16px,3vw,28px); font-weight:700; color:var(--steel-deep); margin:0; }
  .complete-sub{ font-size:clamp(12px,2vw,18px); color:#8C9AAE; margin:clamp(6px,1.2vw,12px) 0 0; }


  .fullscreen-modal{
    display:none;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:#0A0A0A;
    z-index:10000;
    padding:0;
    overflow:hidden;
  }
  .fullscreen-modal.active{display:block;}

  .fullscreen-canvas-container{
    position:absolute;
    top:0; left:0; right:0;
    height:calc(100% - 64px);
    box-sizing:border-box;
    border:2px solid #FFFFFF;
    background:#000;
    overflow:hidden;
  }

  #fullscreenPad{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    display:block;
    background:transparent;
    cursor:crosshair;
    touch-action:none;
    z-index:1;
  }

  .signature-watermark{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    font-size:80px;
    font-weight:bold;
    color:rgba(200,200,200,0.35);
    pointer-events:none;
    z-index:0;
    font-family:Arial,"Noto Sans TC",sans-serif;
    white-space:nowrap;
    user-select:none;
    -webkit-user-select:none;
  }

  .fs-button-group{
    position:absolute;
    bottom:8px; left:50%;
    transform:translateX(-50%);
    display:flex; gap:10px; z-index:10001;
  }
  .btn-clear-fs, .btn-confirm-fs{
    padding:9px 16px; font-size:13px; border:none; border-radius:8px;
    cursor:pointer; font-weight:700; font-family:var(--font-cjk); transition:.15s;
  }
  .btn-clear-fs{background:#fff; color:var(--steel-deep);}
  .btn-clear-fs:hover{background:#eee;}
  .btn-confirm-fs{background:var(--signal); color:#fff;}
  .btn-confirm-fs:hover{background:#e64f18;}

  .close-btn{
    position:absolute;
    top:8px; right:8px;
    background:rgba(255,255,255,.15); color:#fff;
    border:2px solid rgba(255,255,255,.7); border-radius:50%;
    width:36px; height:36px; font-size:18px; cursor:pointer;
    z-index:10002; transition:.15s; display:flex; align-items:center; justify-content:center;
  }
  .close-btn:hover{background:rgba(255,255,255,.3);}

  ::selection{background:var(--signal-dim);}
</style>
</head>
<body>
<div class="device">

  <header>
    <p class="eyebrow">114 學年度 · 高一上學期</p>
    <h1>團體課程諮詢紀錄表</h1>
    <div class="gauge-track">
      <i class="done"><span></span></i>
      <i class="done"><span></span></i>
      <i class="done"><span></span></i>
      <i class="done"><span></span></i>
      <i class="active"><span></span></i>
    </div>
    <p class="step-label">第 <b>5</b> / 5 步 · 確認並簽名</p>
  </header>

  <main>
    <div class="card">
      <p class="name-summary">簽名人：陳怡安</p>
    </div>

    <div class="warn-card">
      <div class="ic">!</div>
      <div class="txt">
        <b>課程地圖說明</b>
        點此觀看《114課程地圖【汽車科】》說明影片 (Edcafe AI)，課程地圖影片連結尚未提供，敬請期待
      </div>
    </div>

    <div class="sig-wrap">
      <div class="sig-label">
        <span>本人簽名</span>
        <button class="expand-btn" id="expandHintBtn" type="button">
          🔍 點擊放大簽名
        </button>
      </div>
      <p class="sig-hint" id="sigHint">簽名已確認並鎖定，如需修改請按「清空重簽」或「點擊放大簽名」</p>

      <div class="sig-canvas-container">
        <canvas id="signatureCanvas" width="300" height="120"></canvas>
      </div>

      <button class="btn-clear" type="button" id="clearBtn">清空重簽</button>
    </div>

    <div class="notice-card">
      送出後<b>先不要關閉視窗</b>，待老師確認並跳出通知訊息「已完成，可關閉頁面」再關閉。
    </div>
  </main>

  <div class="cta-bar">
    <button class="btn btn-prev" type="button">上一步</button>
    <button class="btn btn-next" type="button" id="submitBtn">送出紀錄表</button>
  </div>

  <!-- v15：送出結果通知彈窗（前端流程示範，尚未接後端）
       同一個彈窗，內容由 JS 依「完成」或「退件重簽」動態切換 -->
  <div class="complete-modal" id="completeModal">
    <div class="complete-box">
      <button class="complete-close-btn" id="completeCloseBtn" type="button" title="關閉">✕</button>
      <div class="complete-icon" id="completeIcon">✓</div>
      <p class="complete-text" id="completeText">已完成，可關閉頁面</p>
      <p class="complete-sub" id="completeSub">（此為前端流程示範，實際將由老師後端確認後觸發）</p>
    </div>
  </div>

  <div class="fullscreen-modal" id="fullscreenModal">
    <div class="fullscreen-canvas-container">
      <canvas id="fullscreenPad"></canvas>
      <div class="signature-watermark" id="fullscreenWatermark">簽名</div>
    </div>
    <div class="fs-button-group">
      <button class="btn-clear-fs" id="clearFsBtn" type="button">清空重簽</button>
      <button class="btn-confirm-fs" id="confirmFsBtn" type="button">✓ 確認簽名(橫式)</button>
    </div>
    <button class="close-btn" id="closeBtn" type="button" title="關閉（ESC）">✕</button>
  </div>

</div>

<script>
  const PEN_VISUAL_WIDTH_PX = 3.2; /* v16：筆跡寬度加粗一級（原 2.5），如太粗可再調回 2.5-2.8 之間 */
  const STUDENT_NAME = '陳怡安';

  const SIGNER_ROLE = 'student'; // 'student' | 'parent' | 'teacher'
  const ENABLE_BIOMETRIC_CAPTURE = (SIGNER_ROLE === 'student' || SIGNER_ROLE === 'parent');

  function nowTs() {
    return (window.performance && performance.now) ? performance.now() : Date.now();
  }

  function liveToCanonical(liveX, liveY, liveW, liveH, canonW, canonH) {
    const scale = Math.min(liveW / canonW, liveH / canonH);
    const offsetX = (liveW - canonW * scale) / 2;
    const offsetY = (liveH - canonH * scale) / 2;
    return { x: (liveX - offsetX) / scale, y: (liveY - offsetY) / scale };
  }

  function redrawStrokesCanonical(strokes, ctxRef, color, liveW, liveH, canonW, canonH) {
    if (!strokes || !strokes.length || !canonW || !canonH) return;
    const scale = Math.min(liveW / canonW, liveH / canonH);
    const offsetX = (liveW - canonW * scale) / 2;
    const offsetY = (liveH - canonH * scale) / 2;
    ctxRef.strokeStyle = color;
    ctxRef.lineWidth = PEN_VISUAL_WIDTH_PX;
    ctxRef.lineCap = 'round';
    ctxRef.lineJoin = 'round';
    strokes.forEach(stroke => {
      if (!stroke || stroke.length < 2) return;
      ctxRef.beginPath();
      ctxRef.moveTo(stroke[0].x * scale + offsetX, stroke[0].y * scale + offsetY);
      for (let i = 1; i < stroke.length; i++) {
        ctxRef.lineTo(stroke[i].x * scale + offsetX, stroke[i].y * scale + offsetY);
      }
      ctxRef.stroke();
    });
  }

  /* ============================================
     v13 修正 Bug1：最終簽名圖改用「向量筆跡」重新繪製，
     不再從當下畫面截圖裁切。
     ------------------------------------------------
     舊做法：直接讀取確認當下畫布的像素（getImageData）裁切成
     最終圖檔。若確認當下剛好是旋轉後、簽名被縮小顯示的狀態，
     截出來的圖檔解析度就會偏低（因為簽名本身在畫面上顯示得較小）。

     新做法：直接用「向量筆跡」資料（每個點的座標）在一張獨立、
     固定倍率（3倍）的高解析度畫布上重新畫一次，完全不受確認當下
     裝置是什麼旋轉角度、畫面顯示多大影響，簽名檔畫質永遠一致。

     這也直接回答了「畫質是否影響筆跡真偽辨識」的疑慮：
     真偽辨識用的是這份向量筆跡本身（座標+時間），並非這張圖檔，
     所以圖檔畫質完全不影響辨識準確度。
     ============================================ */
  function renderSignatureFromStrokes(strokes, color) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    strokes.forEach(stroke => {
      stroke.forEach(p => {
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      });
    });
    if (!isFinite(minX) || !isFinite(minY)) return null;

    const pad = PEN_VISUAL_WIDTH_PX * 2;
    minX -= pad; minY -= pad; maxX += pad; maxY += pad;
    const w = Math.max(1, maxX - minX);
    const h = Math.max(1, maxY - minY);

    const RENDER_SCALE = 3; // 固定 3 倍取樣率，畫質不受即時顯示尺寸影響
    const outCanvas = document.createElement('canvas');
    outCanvas.width = Math.round(w * RENDER_SCALE);
    outCanvas.height = Math.round(h * RENDER_SCALE);
    const outCtx = outCanvas.getContext('2d');
    outCtx.scale(RENDER_SCALE, RENDER_SCALE);
    outCtx.strokeStyle = color;
    outCtx.lineWidth = PEN_VISUAL_WIDTH_PX;
    outCtx.lineCap = 'round';
    outCtx.lineJoin = 'round';
    strokes.forEach(stroke => {
      if (!stroke || stroke.length < 2) return;
      outCtx.beginPath();
      outCtx.moveTo(stroke[0].x - minX, stroke[0].y - minY);
      for (let i = 1; i < stroke.length; i++) {
        outCtx.lineTo(stroke[i].x - minX, stroke[i].y - minY);
      }
      outCtx.stroke();
    });

    return { canvas: outCanvas, w, h };
  }

  // ========== 正常（原始版）簽名畫布 ==========
  const canvas = document.getElementById('signatureCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const expandBtn = document.getElementById('expandHintBtn');
  const clearBtn = document.getElementById('clearBtn');
  const sigHint = document.getElementById('sigHint');

  let drawing = false;
  let hasSignature = false;
  let last = { x: 0, y: 0 };
  let normalStrokes = [];
  let currentNormalStroke = null;
  let normalCanonicalW = 0, normalCanonicalH = 0;

  let finalSignatureSourceCanvas = null;
  let finalSignatureCssW = 0;
  let finalSignatureCssH = 0;

  /* ============================================
     v11：小畫布鎖定機制
     ------------------------------------------------
     - 解鎖（smallCanvasLocked = false）：
         保留原始版「直接手寫」能力（平板大螢幕適用），
         touch-action:none 避免手寫時觸發頁面捲動。
     - 鎖定（smallCanvasLocked = true）：
         僅在「放大版簽名確認返回」之後才會觸發，
         畫布變成純預覽，pointer-events:none 讓觸控直接
         穿透給頁面捲動，滑動瀏覽簽名時不會誤觸畫出筆跡。
     - 解鎖的兩種方式：
         1. 按「清空重簽」→ 清除舊簽名 → 恢復可直接手寫
         2. 按「點擊放大簽名」→ 全螢幕重簽 → 確認後 → 再次鎖定
     ============================================ */
  let smallCanvasLocked = false;

  function setSmallCanvasLocked(locked) {
    smallCanvasLocked = locked;
    if (locked) {
      canvas.style.pointerEvents = 'none';
      canvas.style.touchAction = 'auto';
      canvas.onpointerdown = null;
      canvas.onpointermove = null;
      canvas.onpointerup = null;
      canvas.onpointercancel = null;
      canvas.onpointerleave = null;
      sigHint.style.display = 'block';
    } else {
      canvas.style.pointerEvents = 'auto';
      canvas.style.touchAction = 'none';
      bindSmallCanvasDrawing();
      sigHint.style.display = 'none';
    }
  }

  function drawGhostText() {
    const width = canvas.width / (window.devicePixelRatio || 1);
    const height = canvas.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#B9C7D8';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const targetWidth = width * 0.85;
    let fontSize = Math.min(height * 0.7, 100);
    ctx.font = `bold ${fontSize}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;
    let measured = ctx.measureText(STUDENT_NAME).width;
    if (measured > 0) {
      fontSize = fontSize * (targetWidth / measured);
      fontSize = Math.min(fontSize, height * 0.75);
      ctx.font = `bold ${fontSize}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;
    }

    ctx.fillText(STUDENT_NAME, width / 2, height / 2);
  }

  function paintFinalSignatureOntoSmallCanvas() {
    if (!finalSignatureSourceCanvas) return;
    const dpr = window.devicePixelRatio || 1;
    const displayWidth = canvas.width / dpr;
    const displayHeight = canvas.height / dpr;
    const w = finalSignatureCssW, h = finalSignatureCssH;
    if (!w || !h) return;
    const scale = Math.min(displayWidth / w, displayHeight / h);
    ctx.clearRect(0, 0, displayWidth, displayHeight);
    ctx.drawImage(
      finalSignatureSourceCanvas,
      0, 0, finalSignatureSourceCanvas.width, finalSignatureSourceCanvas.height,
      (displayWidth - w * scale) / 2, (displayHeight - h * scale) / 2,
      w * scale, h * scale
    );
  }

  /**
   * 依目前狀態（鎖定/直接手寫中/空白）在畫布尺寸改變時正確重繪。
   */
  function renderSmallCanvasOnResize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    const liveW = rect.width, liveH = rect.height;

    if (smallCanvasLocked && finalSignatureSourceCanvas) {
      paintFinalSignatureOntoSmallCanvas();
    } else if (!smallCanvasLocked && normalStrokes.length && normalCanonicalW && normalCanonicalH) {
      ctx.clearRect(0, 0, liveW, liveH);
      redrawStrokesCanonical(normalStrokes, ctx, '#152238', liveW, liveH, normalCanonicalW, normalCanonicalH);
      hasSignature = true;
    } else {
      drawGhostText();
      hasSignature = false;
    }
  }

  /**
   * 綁定「直接手寫」的指標事件（僅在解鎖狀態下使用）
   */
  function bindSmallCanvasDrawing() {
    canvas.onpointerdown = e => {
      drawing = true;
      const liveRect = canvas.getBoundingClientRect();
      const liveX = e.clientX - liveRect.left;
      const liveY = e.clientY - liveRect.top;
      last = { x: liveX, y: liveY };
      canvas.setPointerCapture(e.pointerId);
      hasSignature = true;

      if (!normalStrokes.length) {
        normalCanonicalW = liveRect.width;
        normalCanonicalH = liveRect.height;
      }
      const canon = liveToCanonical(liveX, liveY, liveRect.width, liveRect.height, normalCanonicalW, normalCanonicalH);
      const pt = { x: canon.x, y: canon.y };
      if (ENABLE_BIOMETRIC_CAPTURE) pt.t = nowTs();
      currentNormalStroke = [pt];
      normalStrokes.push(currentNormalStroke);
    };

    canvas.onpointermove = e => {
      if (!drawing) return;
      const liveRect = canvas.getBoundingClientRect();
      const liveX = e.clientX - liveRect.left;
      const liveY = e.clientY - liveRect.top;
      ctx.strokeStyle = '#152238';
      ctx.lineWidth = PEN_VISUAL_WIDTH_PX;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(liveX, liveY);
      ctx.stroke();
      last = { x: liveX, y: liveY };
      const canon = liveToCanonical(liveX, liveY, liveRect.width, liveRect.height, normalCanonicalW, normalCanonicalH);
      const pt = { x: canon.x, y: canon.y };
      if (ENABLE_BIOMETRIC_CAPTURE) pt.t = nowTs();
      currentNormalStroke.push(pt);
    };

    const stopDrawing = () => {
      if (!drawing) return;
      drawing = false;
      captureDirectSignature();
    };

    canvas.onpointerup = stopDrawing;
    canvas.onpointercancel = stopDrawing;
    canvas.onpointerleave = stopDrawing;
  }

  /**
   * 直接在原始版小畫布上簽名時，每一筆結束都更新一次目前的簽名圖，
   * 但「不」自動鎖定 —— 讓使用者可以繼續寫下一筆（例如姓名的下一個字）。
   * 只有透過放大版確認流程才會觸發鎖定。
   */
  function captureDirectSignature() {
    if (!normalStrokes.length) return;
    const result = renderSignatureFromStrokes(normalStrokes, '#152238');
    if (!result) return;

    window.__finalSignatureDataURL = result.canvas.toDataURL();
    window.__finalSignatureAspectRatio = result.w / result.h;
    window.__finalSignatureSource = 'normal';

    if (ENABLE_BIOMETRIC_CAPTURE) {
      window.__signatureBiometricData = {
        role: SIGNER_ROLE,
        source: 'normal',
        capturedAt: Date.now(),
        strokes: normalStrokes
      };
    }
  }

  clearBtn.addEventListener('click', () => {
    drawing = false;
    hasSignature = false;
    normalStrokes = [];
    currentNormalStroke = null;
    normalCanonicalW = 0; normalCanonicalH = 0;
    finalSignatureSourceCanvas = null;
    window.__finalSignatureDataURL = null;
    window.__signatureBiometricData = null;
    setSmallCanvasLocked(false); // 清空後恢復可直接手寫
    drawGhostText();
  });

  expandBtn.addEventListener('click', enterFullscreenSignature);

  // 初始狀態：解鎖，可直接手寫
  bindSmallCanvasDrawing();

  // ========== 全螢幕簽名（放大版）==========
  const fsModal = document.getElementById('fullscreenModal');
  const fsPad = document.getElementById('fullscreenPad');
  const fsCtx = fsPad.getContext('2d', { willReadFrequently: true });
  const closeBtn = document.getElementById('closeBtn');
  const clearFsBtn = document.getElementById('clearFsBtn');
  const confirmFsBtn = document.getElementById('confirmFsBtn');

  let fsDrawing = false;
  let fsHasSignature = false;
  let fsLast = { x: 0, y: 0 };
  let fsResizeHandlerBound = false;
  let fsStrokes = [];
  let currentFsStroke = null;
  let fsCanonicalW = 0, fsCanonicalH = 0;

  function getDynamicBorderWidth() {
    const shorterSide = Math.min(window.innerWidth, window.innerHeight);
    const dpr = window.devicePixelRatio;
    let borderWidth;
    if (shorterSide < 600) borderWidth = 2.0;
    else if (shorterSide < 900) borderWidth = 2.5;
    else if (shorterSide < 1200) borderWidth = 2.8;
    else if (shorterSide < 1500) borderWidth = 3.0;
    else if (shorterSide < 2000) borderWidth = 3.2;
    else borderWidth = 3.5;
    if (dpr > 2) borderWidth = borderWidth * 0.9;
    return Math.max(1.5, Math.min(borderWidth, 4.0));
  }

  function computeWatermarkFontSize(containerW, containerH, text) {
    const targetWidth = containerW * 0.72;
    const measureCanvas = computeWatermarkFontSize._c || (computeWatermarkFontSize._c = document.createElement('canvas'));
    const mctx = measureCanvas.getContext('2d');
    let fontSize = Math.min(containerH * 0.55, 400);
    mctx.font = `bold ${fontSize}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;
    let measured = mctx.measureText(text).width;
    if (measured > 0) {
      fontSize = fontSize * (targetWidth / measured);
      fontSize = Math.min(fontSize, containerH * 0.6);
    }
    return Math.max(32, Math.round(fontSize));
  }

  function applyDynamicStyles() {
    const borderWidth = getDynamicBorderWidth();
    const container = document.querySelector('.fullscreen-canvas-container');
    if (container) container.style.borderWidth = borderWidth + 'px';

    const watermark = document.querySelector('.signature-watermark');
    if (container && watermark) {
      const cW = container.clientWidth;
      const cH = container.clientHeight;
      const fontSize = computeWatermarkFontSize(cW, cH, STUDENT_NAME);
      watermark.style.fontSize = fontSize + 'px';
    }
  }

  function sizeFullscreenCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = fsPad.getBoundingClientRect();
    fsPad.width = Math.max(1, Math.round(rect.width * dpr));
    fsPad.height = Math.max(1, Math.round(rect.height * dpr));
    fsCtx.setTransform(1, 0, 0, 1, 0, 0);
    fsCtx.scale(dpr, dpr);
    return { cssWidth: rect.width, cssHeight: rect.height };
  }

  function initFullscreenSignature(preserve) {
    const { cssWidth: liveW, cssHeight: liveH } = sizeFullscreenCanvas();

    fsCtx.clearRect(0, 0, liveW, liveH);

    if (preserve && fsStrokes.length && fsCanonicalW && fsCanonicalH) {
      redrawStrokesCanonical(fsStrokes, fsCtx, '#FFFFFF', liveW, liveH, fsCanonicalW, fsCanonicalH);
      fsHasSignature = true;
    } else {
      fsHasSignature = false;
    }

    fsPad.onpointerdown = e => {
      fsDrawing = true;
      const rect = fsPad.getBoundingClientRect();
      fsLast = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      fsPad.setPointerCapture(e.pointerId);
      fsHasSignature = true;

      if (!fsStrokes.length) {
        fsCanonicalW = rect.width;
        fsCanonicalH = rect.height;
      }
      const canon = liveToCanonical(fsLast.x, fsLast.y, rect.width, rect.height, fsCanonicalW, fsCanonicalH);
      const pt = { x: canon.x, y: canon.y };
      if (ENABLE_BIOMETRIC_CAPTURE) pt.t = nowTs();
      currentFsStroke = [pt];
      fsStrokes.push(currentFsStroke);
    };

    fsPad.onpointermove = e => {
      if (!fsDrawing) return;
      const rect = fsPad.getBoundingClientRect();
      const p = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      fsCtx.strokeStyle = '#FFFFFF';
      fsCtx.lineWidth = PEN_VISUAL_WIDTH_PX;
      fsCtx.lineCap = 'round';
      fsCtx.lineJoin = 'round';
      fsCtx.beginPath();
      fsCtx.moveTo(fsLast.x, fsLast.y);
      fsCtx.lineTo(p.x, p.y);
      fsCtx.stroke();
      fsLast = p;
      const canon = liveToCanonical(p.x, p.y, rect.width, rect.height, fsCanonicalW, fsCanonicalH);
      const pt = { x: canon.x, y: canon.y };
      if (ENABLE_BIOMETRIC_CAPTURE) pt.t = nowTs();
      currentFsStroke.push(pt);
    };

    const stopFsDrawing = () => { fsDrawing = false; };
    fsPad.onpointerup = stopFsDrawing;
    fsPad.onpointercancel = stopFsDrawing;
    fsPad.onpointerleave = stopFsDrawing;
  }

  function enterFullscreenSignature() {
    fsModal.classList.add('active');

    if (!fsResizeHandlerBound) {
      window.addEventListener('orientationchange', () => {
        if (!fsModal.classList.contains('active')) return;
        setTimeout(() => {
          applyDynamicStyles();
          initFullscreenSignature(true);
        }, 350);
      });
      window.addEventListener('resize', () => {
        if (!fsModal.classList.contains('active')) return;
        setTimeout(() => {
          applyDynamicStyles();
          initFullscreenSignature(true);
        }, 150);
      });
      fsResizeHandlerBound = true;
    }

    fsStrokes = [];
    currentFsStroke = null;
    fsCanonicalW = 0; fsCanonicalH = 0;

    setTimeout(() => {
      applyDynamicStyles();
      initFullscreenSignature(false);
    }, 50);

    const watermarkEl = document.getElementById('fullscreenWatermark');
    if (watermarkEl) watermarkEl.textContent = STUDENT_NAME;
  }

  function exitFullscreenSignature() {
    fsModal.classList.remove('active');
    fsStrokes = [];
    currentFsStroke = null;
    fsCanonicalW = 0; fsCanonicalH = 0;
  }

  function clearFullscreenPad() {
    const dpr = window.devicePixelRatio || 1;
    fsCtx.clearRect(0, 0, fsPad.width / dpr, fsPad.height / dpr);
    fsHasSignature = false;
    fsDrawing = false;
    fsStrokes = [];
    currentFsStroke = null;
    fsCanonicalW = 0; fsCanonicalH = 0;
  }

  /**
   * 放大版確認簽名 → 依比例疊回原始版 → 立即鎖定原始版小畫布
   */
  function captureFinalSignatureFromFullscreen() {
    if (!fsStrokes.length) return;
    const result = renderSignatureFromStrokes(fsStrokes, '#152238');
    if (!result) return;

    window.__finalSignatureDataURL = result.canvas.toDataURL();
    window.__finalSignatureAspectRatio = result.w / result.h;
    window.__finalSignatureSource = 'fullscreen';

    // 依字體正確比例（contain-fit，等比例不變形）疊回原始版畫布
    finalSignatureSourceCanvas = result.canvas;
    finalSignatureCssW = result.w;
    finalSignatureCssH = result.h;
    paintFinalSignatureOntoSmallCanvas();

    // 清掉舊的直接手寫向量資料（已被放大版簽名取代）
    normalStrokes = [];
    currentNormalStroke = null;
    normalCanonicalW = 0; normalCanonicalH = 0;
    hasSignature = true;

    // 關鍵：立即鎖定原始版小畫布，避免捲動時誤觸
    setSmallCanvasLocked(true);

    if (ENABLE_BIOMETRIC_CAPTURE) {
      window.__signatureBiometricData = {
        role: SIGNER_ROLE,
        source: 'fullscreen',
        capturedAt: Date.now(),
        strokes: fsStrokes
      };
    }
  }

  closeBtn.addEventListener('click', exitFullscreenSignature);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && fsModal.classList.contains('active')) exitFullscreenSignature();
  });

  clearFsBtn.addEventListener('click', clearFullscreenPad);
  confirmFsBtn.addEventListener('click', () => {
    if (fsHasSignature) captureFinalSignatureFromFullscreen();
    fsStrokes = [];
    currentFsStroke = null;
    fsCanonicalW = 0; fsCanonicalH = 0;
    exitFullscreenSignature();
  });

  /* ============================================
     v12 修正：原始版小畫布的 resize 重繪加上延遲防抖
     ------------------------------------------------
     手機捲動時，瀏覽器網址列會有「隱藏/顯示」的過渡動畫，
     這段期間畫面尺寸是暫時性、不穩定的數值（甚至短暫為 0）。
     放大版的重繪本來就有加延遲（150-350ms）等畫面穩定再量測，
     但原始版小畫布漏了這個保護，導致捲動時量到過渡中的錯誤
     尺寸，算出的縮放比例失真，重繪後簽名變得不可見（如同消失）。
     這裡補上相同的延遲保護，並用 clearTimeout 避免捲動過程中
     連續觸發的多次 resize 事件疊加執行。
     ============================================ */
  let smallCanvasResizeTimer = null;
  window.addEventListener('load', renderSmallCanvasOnResize);
  window.addEventListener('resize', () => {
    if (fsModal.classList.contains('active')) return;
    clearTimeout(smallCanvasResizeTimer);
    smallCanvasResizeTimer = setTimeout(() => {
      renderSmallCanvasOnResize();
    }, 150);
  });

  /* ============================================
     v13 新增、v15 擴充 Bug4/6：送出紀錄表 → 老師審核結果通知
     （前端流程示範，尚未接後端）
     ------------------------------------------------
     後端尚未建置，這裡先用 5 秒延遲模擬「老師在後端管理頁面
     檢查」的情境，方便 Ethen 先驗證前端流程是否符合預期。

     v15 新增「兩輪示範」：
       第 1 次送出 → 5 秒後模擬「老師檢查認為簽名不清楚」→
         跳出「簽名不清楚或潦草，請重簽」，底部按鈕變回可點擊
         狀態文字「重新簽名後送出」，並重新解鎖原始版小畫布
         （學生可直接在原始版或透過放大版重新簽名）。
       第 2 次（含）以後送出 → 5 秒後模擬「老師確認 OK」→
         跳出「已完成，可關閉頁面」，底部按鈕文字改為
         「已完成，可關閉視窗」並鎖定不可再點。

     未來接上真實後端後，這一段要改成：
       1. 送出按鈕改為呼叫後端 API，把簽名資料
          （window.__finalSignatureDataURL / window.__signatureBiometricData）
          連同學號、姓名等資料一起送出
       2. 前端改為輪詢或 WebSocket 監聽後端狀態，老師在管理頁面
          按下「完成」或「退回重簽」時，後端狀態改變，
          前端才觸發對應的通知（而不是寫死 5 秒 / 寫死兩輪結果）
     ============================================ */
  const completeModal = document.getElementById('completeModal');
  const completeCloseBtn = document.getElementById('completeCloseBtn');
  const completeIcon = document.getElementById('completeIcon');
  const completeText = document.getElementById('completeText');
  const completeSub = document.getElementById('completeSub');
  const submitBtnEl = document.getElementById('submitBtn');

  let submitAttemptCount = 0;

  function showResultModal(type) {
    if (type === 'reject') {
      completeIcon.textContent = '!';
      completeIcon.classList.add('is-reject');
      completeText.textContent = '簽名不清楚或潦草，請重簽';
      completeSub.textContent = '（此為前端流程示範，實際將由老師後端檢查後觸發）';
    } else {
      completeIcon.textContent = '✓';
      completeIcon.classList.remove('is-reject');
      completeText.textContent = '已完成，可關閉頁面';
      completeSub.textContent = '（此為前端流程示範，實際將由老師後端確認後觸發）';
    }
    completeModal.classList.add('active');
  }

  submitBtnEl.addEventListener('click', () => {
    if (!window.__finalSignatureDataURL) {
      alert('請先完成簽名再送出');
      return;
    }
    submitAttemptCount++;
    submitBtnEl.disabled = true;
    submitBtnEl.textContent = '已送出，等待老師確認中...';

    // demo 用固定 5 秒延遲，模擬後端老師檢查
    setTimeout(() => {
      if (submitAttemptCount === 1) {
        // 第一次送出：demo 模擬老師認為簽名不清楚，退回重簽
        showResultModal('reject');
        submitBtnEl.disabled = false;
        submitBtnEl.textContent = '重新簽名後送出';
        // 重新開放簽名功能，學生可在原始版直接手寫或透過放大版重簽
        setSmallCanvasLocked(false);
      } else {
        // 第二次（含）以後送出：demo 模擬老師確認 OK
        showResultModal('success');
        submitBtnEl.disabled = true;
        submitBtnEl.textContent = '已完成，可關閉視窗';
      }
    }, 5000);
  });

  completeCloseBtn.addEventListener('click', () => {
    completeModal.classList.remove('active');
  });
</script>
</body>
</html>

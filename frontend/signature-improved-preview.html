<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>課程諮詢紀錄表 - 簽名測試</title>
<style>
  :root{
    --ink:#152238;
    --steel:#1E3A5F;
    --steel-deep:#0F2540;
    --steel-pale:#E8EEF5;
    --line:#D7E0EA;
    --signal:#FF5A1F;
    --signal-dim:#FFE7DB;
    --paper:#FBFAF7;
    --ok:#1E7A4C;
    --font-cjk: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--steel-deep);font-family:var(--font-cjk);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    background:
      radial-gradient(circle at 20% -10%, #2A4C74 0%, transparent 45%),
      var(--steel-deep);
  }
  .device{
    width:100%;
    max-width:460px;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 60px rgba(0,0,0,.4);
  }

  /* ---- Header / progress ---- */
  header{
    background:linear-gradient(135deg, var(--steel-deep), var(--steel) 70%);
    color:#fff;
    padding:20px 20px 22px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; right:-30px; top:-30px;
    width:160px; height:160px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.08);
  }
  header::before{
    content:"";
    position:absolute; right:10px; top:40px;
    width:100px; height:100px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.06);
  }
  .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:#9FC1E0; font-weight:600; margin:0 0 4px; position:relative;
  }
  h1{
    font-size:19px; margin:0 0 14px; font-weight:700; line-height:1.4;
    position:relative;
  }
  .gauge-track{
    display:flex; gap:5px; position:relative;
  }
  .gauge-track i{
    flex:1; height:4px; border-radius:2px;
    background:rgba(255,255,255,.18);
    overflow:hidden;
  }
  .gauge-track i span{
    display:block; height:100%; width:0%;
    background:var(--signal);
    transition:width .4s ease;
  }
  .gauge-track i.done span{width:100%;}
  .gauge-track i.active span{width:55%;}
  .step-label{
    margin-top:8px; font-size:12px; color:#C9DCEE; letter-spacing:.02em; position:relative;
  }
  .step-label b{color:#fff;}

  /* ---- Body ---- */
  main{flex:1; padding:22px 20px 110px; overflow-y:auto;}

  .card{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:20px 18px; margin-bottom:16px;
  }

  .name-summary{
    font-size:14px; font-weight:700; color:var(--steel-deep); margin:0;
  }

  /* 課程地圖說明 警示卡 */
  .warn-card{
    display:flex; gap:10px;
    background:var(--signal-dim); border:1px solid #FFCBB0; border-radius:12px;
    padding:14px 14px; margin-bottom:16px;
  }
  .warn-card .ic{
    width:26px; height:26px; border-radius:50%; background:var(--signal);
    color:#fff; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700;
  }
  .warn-card .txt{font-size:12.5px; color:#7A3A1E; line-height:1.6;}
  .warn-card .txt b{color:var(--steel-deep); display:block; margin-bottom:2px; font-size:13.5px;}
  .warn-card a{color:var(--steel); font-weight:700; text-decoration:none;}

  /* ---- 簽名區塊 ---- */
  .sig-wrap{background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px;}

  .sig-label{
    font-size:14px; font-weight:700; color:var(--steel-deep);
    margin:0 0 12px; display:flex; justify-content:space-between; align-items:center;
  }
  .expand-btn{
    display:flex; align-items:center; gap:5px;
    background:#fff; border:1.5px solid var(--signal); color:var(--signal);
    border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:700;
    cursor:pointer; transition:.15s;
  }
  .expand-btn:hover:not(.hidden){background:var(--signal-dim);}
  .expand-btn.hidden{display:none;}

  .sig-canvas-container{
    position:relative;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:var(--steel-pale);
    overflow:hidden;
    margin-bottom:12px;
    display:flex; align-items:center; justify-content:center;
  }

  #signatureCanvas{
    width:100%; height:180px; display:block;
    touch-action:none; cursor:crosshair;
  }

  .btn-clear{
    width:100%;
    padding:11px; border-radius:10px; border:1.5px solid var(--line);
    background:#fff; color:#5C6C81; font-size:14px; font-weight:700;
    font-family:var(--font-cjk); cursor:pointer; transition:.15s;
  }
  .btn-clear:hover{background:var(--steel-pale);}

  /* 送出提醒卡 */
  .notice-card{
    background:var(--signal-dim); border:1px solid #FFCBB0; border-radius:12px;
    padding:13px 14px; margin-top:16px; font-size:12.5px; color:#7A3A1E; line-height:1.7;
  }
  .notice-card b{color:var(--steel-deep);}

  /* ---- 底部按鈕列 ---- */
  .cta-bar{
    position:sticky; left:0; right:0; bottom:0;
    background:linear-gradient(0deg, var(--paper) 60%, rgba(251,250,247,0));
    padding:22px 20px 20px; display:flex; gap:10px;
  }
  .btn{
    flex:1; padding:14px; border-radius:11px; border:none;
    font-size:15px; font-weight:700; font-family:var(--font-cjk); cursor:pointer;
  }
  .btn-prev{background:#fff; border:1.5px solid var(--line); color:#5C6C81; flex:0 0 92px;}
  .btn-next{
    background:var(--signal); color:#fff;
    box-shadow:0 8px 18px rgba(255,90,31,.35);
  }
  .btn-next:active{transform:translateY(1px);}

  /* ---- 全螢幕簽名 Modal ---- */
  .fullscreen-modal{
    display:none;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:#0A0A0A;
    z-index:10000;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:0;
    overflow:hidden;
    margin:0;
  }
  .fullscreen-modal.active{display:flex;}

  #fullscreenPad{
    border:none; border-radius:0;
    background:#0A0A0A;
    cursor:crosshair; touch-action:none;
    width:100vw;
    height:100vh;
    display:block;
  }

  .fs-button-group{
    position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; z-index:10001;
  }
  .btn-clear-fs, .btn-confirm-fs{
    padding:8px 14px; font-size:13px; border:none; border-radius:8px;
    cursor:pointer; font-weight:700; font-family:var(--font-cjk); transition:.15s;
  }
  
  /* 橫置時縮小按鈕（寬高比 > 1.2） */
  @media (orientation: landscape) {
    .btn-clear-fs, .btn-confirm-fs{
      padding:6px 10px; font-size:11px;
    }
  }
  .btn-clear-fs{background:#fff; color:var(--steel-deep);}
  .btn-clear-fs:hover{background:#eee;}
  .btn-confirm-fs{background:var(--signal); color:#fff;}
  .btn-confirm-fs:hover{background:#e64f18;}

  .close-btn{
    position:fixed; top:8px; right:8px;
    background:rgba(255,255,255,.15); color:#fff;
    border:2px solid rgba(255,255,255,.7); border-radius:50%;
    width:36px; height:36px; font-size:18px; cursor:pointer;
    z-index:10002; transition:.15s; display:flex; align-items:center; justify-content:center;
  }
  .close-btn:hover{background:rgba(255,255,255,.3);}

  ::selection{background:var(--signal-dim);}
</style>
</head>
<body>
<div class="device">

  <header>
    <p class="eyebrow">114 學年度 · 高一上學期</p>
    <h1>團體課程諮詢紀錄表</h1>
    <div class="gauge-track">
      <i class="done"><span></span></i>
      <i class="done"><span></span></i>
      <i class="done"><span></span></i>
      <i class="done"><span></span></i>
      <i class="active"><span></span></i>
    </div>
    <p class="step-label">第 <b>5</b> / 5 步 · 確認並簽名</p>
  </header>

  <main>
    <div class="card">
      <p class="name-summary">簽名人：陳怡安</p>
    </div>

    <div class="warn-card">
      <div class="ic">!</div>
      <div class="txt">
        <b>課程地圖說明</b>
        點此觀看《114課程地圖【汽車科】》說明影片
        (Edcafe AI)
        <br>課程地圖影片連結尚未提供，敬請期待
      </div>
    </div>

    <div class="sig-wrap">
      <div class="sig-label">
        <span>本人簽名</span>
        <button class="expand-btn" id="expandHintBtn" type="button">
          🔍 點擊放大簽名
        </button>
      </div>

      <div class="sig-canvas-container">
        <canvas id="signatureCanvas" width="300" height="120"></canvas>
      </div>

      <button class="btn-clear" type="button" id="clearBtn">清空重簽</button>
    </div>

    <div class="notice-card">
      送出後將先不要關閉此頁面，待考老師核可完成後畫面會自動顯示「完成」按鈕。
    </div>
  </main>

  <div class="cta-bar">
    <button class="btn btn-prev" type="button">上一步</button>
    <button class="btn btn-next" type="button" id="submitBtn">送出紀錄表</button>
  </div>

  <!-- 全螢幕簽名 Modal -->
  <div class="fullscreen-modal" id="fullscreenModal">
    <canvas id="fullscreenPad"></canvas>
    <div class="fs-button-group">
      <button class="btn-clear-fs" id="clearFsBtn" type="button">清空重簽</button>
      <button class="btn-confirm-fs" id="confirmFsBtn" type="button">✓ 確認簽名</button>
    </div>
    <button class="close-btn" id="closeBtn" type="button" title="關閉（ESC）">✕</button>
  </div>

</div>

<script>
  // ========== 正常簽名畫布 ==========
  const canvas = document.getElementById('signatureCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const expandBtn = document.getElementById('expandHintBtn');
  const clearBtn = document.getElementById('clearBtn');

  let drawing = false;
  let hasSignature = false;
  let last = { x: 0, y: 0 };

  const PEN_VISUAL_WIDTH_PX = 2.5;
  const STUDENT_NAME = '陳怡安';

  function resizeCanvasToDisplaySize(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
  }

  function drawGhostText() {
    const width = canvas.width / (window.devicePixelRatio || 1);
    const height = canvas.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#B9C7D8';
    ctx.font = 'bold 30px "Noto Sans TC","Microsoft JhengHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(STUDENT_NAME, width / 2, height / 2);
  }

  function canvasPos(canvas, e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function initSignaturePad() {
    resizeCanvasToDisplaySize(canvas);
    drawGhostText();
    hasSignature = false;

    canvas.onpointerdown = e => {
      drawing = true;
      last = canvasPos(canvas, e);
      canvas.setPointerCapture(e.pointerId);
      if (!hasSignature) {
        expandBtn.classList.add('hidden');
        hasSignature = true;
      }
    };

    canvas.onpointermove = e => {
      if (!drawing) return;
      const p = canvasPos(canvas, e);
      const dpr = window.devicePixelRatio || 1;
      ctx.strokeStyle = '#152238';
      ctx.lineWidth = PEN_VISUAL_WIDTH_PX * dpr;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(last.x * dpr, last.y * dpr);
      ctx.lineTo(p.x * dpr, p.y * dpr);
      ctx.stroke();
      last = p;
    };

    const stopDrawing = () => {
      if (!drawing) return;
      drawing = false;
      captureFinalSignature('normal');
    };

    canvas.onpointerup = stopDrawing;
    canvas.onpointercancel = stopDrawing;
    canvas.onpointerleave = stopDrawing;
    window.addEventListener('pointerup', stopDrawing);
  }

  clearBtn.addEventListener('click', () => {
    drawing = false;
    hasSignature = false;
    expandBtn.classList.remove('hidden');
    drawGhostText();
    window.__finalSignatureDataURL = null;
  });

  expandBtn.addEventListener('click', enterFullscreenSignature);

  // ========== 全螢幕簽名 ==========
  const fsModal = document.getElementById('fullscreenModal');
  const fsPad = document.getElementById('fullscreenPad');
  const fsCtx = fsPad.getContext('2d', { willReadFrequently: true });
  const closeBtn = document.getElementById('closeBtn');
  const clearFsBtn = document.getElementById('clearFsBtn');
  const confirmFsBtn = document.getElementById('confirmFsBtn');

  let fsDrawing = false;
  let fsHasSignature = false;
  let fsLast = { x: 0, y: 0 };
  let fsResizeHandlerBound = false;
  let fsLastCssWidth = 0;
  let fsLastCssHeight = 0;
  let fsResizeDebounceTimer = null;

  // 主要墨跡快照：只在使用者實際畫線後更新，永遠保持「未經多次重繪」的最高品質版本
  // 轉向時一律從這份快照重繪，而不是從上一次已經被縮放過的畫面複製，避免世代性失真累積
  let fsMasterCanvas = null;
  let fsMasterBBox = null;   // 主快照中的墨跡邊界框（device px，相對於 fsMasterCanvas）
  let fsMasterDpr = 1;       // 擷取主快照當下的 devicePixelRatio

  function sizeFullscreenCanvas() {
    const dpr = window.devicePixelRatio || 1;
    fsPad.width = window.innerWidth * dpr;
    fsPad.height = window.innerHeight * dpr;
    fsCtx.scale(dpr, dpr);
  }

  function adjustButtonsForOrientation() {
    const isLandscape = window.innerWidth > window.innerHeight;
    const buttonGroup = document.querySelector('.fs-button-group');
    
    if (isLandscape) {
      // 橫置：按鈕縮小
      buttonGroup.style.bottom = '8px';
      document.querySelectorAll('.btn-clear-fs, .btn-confirm-fs').forEach(btn => {
        btn.style.padding = '5px 10px';
        btn.style.fontSize = '11px';
      });
    } else {
      // 豎置：按鈕恢復原大小
      buttonGroup.style.bottom = '10px';
      document.querySelectorAll('.btn-clear-fs, .btn-confirm-fs').forEach(btn => {
        btn.style.padding = '8px 14px';
        btn.style.fontSize = '13px';
      });
    }
  }

  // 掃描畫布找出實際墨跡的邊界框（緊貼筆跡範圍，非整張畫布）
  function getInkBoundingBox(canvasEl) {
    const w = canvasEl.width, h = canvasEl.height;
    if (w === 0 || h === 0) return null;
    let imageData;
    try {
      imageData = canvasEl.getContext('2d').getImageData(0, 0, w, h);
    } catch (e) {
      return null;
    }
    const data = imageData.data;
    let minX = w, maxX = 0, minY = h, maxY = 0, found = false;
    for (let i = 0; i < data.length; i += 4) {
      if (data[i + 3] > 20) { // 有可見墨跡（含反鋸齒邊緣）
        found = true;
        const idx = i / 4;
        const x = idx % w, y = Math.floor(idx / w);
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
    return found ? { minX, maxX, minY, maxY } : null;
  }

  // 使用者剛畫完一筆時呼叫：把目前畫布（手繪原始品質，未經任何縮放重繪）存為主快照
  function updateMasterSnapshot() {
    const bbox = getInkBoundingBox(fsPad);
    if (!bbox) return;
    const master = document.createElement('canvas');
    master.width = fsPad.width;
    master.height = fsPad.height;
    master.getContext('2d').drawImage(fsPad, 0, 0);
    fsMasterCanvas = master;
    fsMasterBBox = bbox;
    fsMasterDpr = window.devicePixelRatio || 1;
  }

  // 轉向/尺寸變化時呼叫：一律從主快照（原始無損版本）重新定位繪製，避免重複重繪造成的品質流失
  function initFullscreenSignature() {
    const dpr = window.devicePixelRatio || 1;
    const newCssWidth = window.innerWidth;
    const newCssHeight = window.innerHeight;

    // 若尺寸沒有實質變化，跳過（避免軟鍵盤/瀏覽器工具列微幅變動誤觸發）
    if (Math.abs(newCssWidth - fsLastCssWidth) < 2 && Math.abs(newCssHeight - fsLastCssHeight) < 2 && fsPad.width > 0) {
      return;
    }

    // 重新設定畫布尺寸（此動作會自動清空畫布）
    sizeFullscreenCanvas();

    if (fsHasSignature && fsMasterCanvas && fsMasterBBox) {
      const bboxWCss = Math.round((fsMasterBBox.maxX - fsMasterBBox.minX) / fsMasterDpr);
      const bboxHCss = Math.round((fsMasterBBox.maxY - fsMasterBBox.minY) / fsMasterDpr);
      // 只有當墨跡尺寸大於新畫面可用空間時才縮小，否則保持原始大小（=1，整數像素、無損複製）
      let scale = Math.min(1, newCssWidth / bboxWCss, newCssHeight / bboxHCss);
      if (scale > 0.98) scale = 1;

      const drawWCss = Math.round(bboxWCss * scale);
      const drawHCss = Math.round(bboxHCss * scale);
      const offsetXCss = Math.round((newCssWidth - drawWCss) / 2);
      const offsetYCss = Math.round((newCssHeight - drawHCss) / 2);

      // scale=1 時關閉平滑，做到真正的整數像素無損複製；需要縮小時才開平滑以求畫質
      fsCtx.imageSmoothingEnabled = (scale !== 1);

      fsCtx.drawImage(
        fsMasterCanvas,
        fsMasterBBox.minX, fsMasterBBox.minY,
        fsMasterBBox.maxX - fsMasterBBox.minX, fsMasterBBox.maxY - fsMasterBBox.minY,
        offsetXCss, offsetYCss, drawWCss, drawHCss
      );
    }

    fsLastCssWidth = newCssWidth;
    fsLastCssHeight = newCssHeight;

    fsPad.onpointerdown = e => {
      fsDrawing = true;
      const rect = fsPad.getBoundingClientRect();
      fsLast = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      fsPad.setPointerCapture(e.pointerId);
      fsHasSignature = true;
    };

    fsPad.onpointermove = e => {
      if (!fsDrawing) return;
      const rect = fsPad.getBoundingClientRect();
      const p = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      const dpr2 = window.devicePixelRatio || 1;
      fsCtx.imageSmoothingEnabled = true;
      fsCtx.strokeStyle = '#FFFFFF';
      fsCtx.lineWidth = PEN_VISUAL_WIDTH_PX * dpr2;
      fsCtx.lineCap = 'round';
      fsCtx.lineJoin = 'round';
      fsCtx.beginPath();
      fsCtx.moveTo(fsLast.x * dpr2, fsLast.y * dpr2);
      fsCtx.lineTo(p.x * dpr2, p.y * dpr2);
      fsCtx.stroke();
      fsLast = p;
    };

    const stopFsDrawing = () => {
      if (!fsDrawing) return;
      fsDrawing = false;
      updateMasterSnapshot(); // 畫完這一筆，立即更新主快照（原始最高品質）
    };
    fsPad.onpointerup = stopFsDrawing;
    fsPad.onpointercancel = stopFsDrawing;
    fsPad.onpointerleave = stopFsDrawing;
  }

  // 統一的 debounce 處理函數，避免 orientationchange + resize 重複觸發造成多次 init
  function handleFsResize() {
    if (!fsModal.classList.contains('active')) return;
    clearTimeout(fsResizeDebounceTimer);
    fsResizeDebounceTimer = setTimeout(() => {
      initFullscreenSignature();
      adjustButtonsForOrientation();
    }, 300);
  }

  function enterFullscreenSignature() {
    console.log('📱 enterFullscreenSignature() 被調用');
    fsModal.classList.add('active');

    // 立即呼叫 Fullscreen API，隱藏瀏覽器網址列和控制項
    const requestFS = fsModal.requestFullscreen ||
                     fsModal.webkitRequestFullscreen ||
                     fsModal.mozRequestFullScreen ||
                     fsModal.msRequestFullscreen;
    
    if (requestFS) {
      console.log('✅ Fullscreen API 可用，嘗試調用...');
      requestFS.call(fsModal)
        .then(() => {
          console.log('✅ Fullscreen 成功進入');
        })
        .catch(err => {
          console.log('❌ Fullscreen API 呼叫失敗：', err.message);
          console.log('   可能原因：iOS Safari 限制、用戶未授權、或瀏覽器政策');
        });
    } else {
      console.log('❌ Fullscreen API 不可用（瀏覽器不支援）');
    }

    if (!fsResizeHandlerBound) {
      window.addEventListener('orientationchange', handleFsResize);
      window.addEventListener('resize', handleFsResize);
      fsResizeHandlerBound = true;
    }

    setTimeout(() => {
      initFullscreenSignature();
      adjustButtonsForOrientation();
    }, 50);
  }

  function exitFullscreenSignature() {
    fsModal.classList.remove('active');
    const exitFS = document.exitFullscreen ||
                  document.webkitExitFullscreen ||
                  document.mozCancelFullScreen ||
                  document.msExitFullscreen;
    if (exitFS) { exitFS.call(document).catch(() => {}); }
  }

  function clearFullscreenPad() {
    const dpr = window.devicePixelRatio || 1;
    fsCtx.clearRect(0, 0, fsPad.width / dpr, fsPad.height / dpr);
    fsHasSignature = false;
    fsDrawing = false;
    fsMasterCanvas = null;
    fsMasterBBox = null;
  }

  function captureFinalSignature(source) {
    if (source === 'fullscreen') {
      const dpr = window.devicePixelRatio || 1;
      const imageData = fsCtx.getImageData(0, 0, fsPad.width, fsPad.height);
      const data = imageData.data;
      let minX = fsPad.width, maxX = 0, minY = fsPad.height, maxY = 0;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
        if (a > 128 && r > 200 && g > 200 && b > 200) {
          const pixelIndex = i / 4;
          const x = pixelIndex % fsPad.width;
          const y = Math.floor(pixelIndex / fsPad.width);
          minX = Math.min(minX, x); maxX = Math.max(maxX, x);
          minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        }
      }
      if (minX <= maxX && minY <= maxY) {
        const w = Math.ceil((maxX - minX) / dpr);
        const h = Math.ceil((maxY - minY) / dpr);
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = w * dpr; cropCanvas.height = h * dpr;
        const cropCtx = cropCanvas.getContext('2d');
        cropCtx.drawImage(fsPad, minX, minY, w * dpr, h * dpr, 0, 0, w * dpr, h * dpr);

        // 全螢幕版是白色筆跡（黑底對比用），但正式存檔與小畫布預覽
        // 都必須是深色墨水（跟小畫布本身的黑色筆跡一致），因此在此做顏色轉換：
        // 保留筆跡的透明度/形狀，僅將顏色由白轉換為深色墨水 #152238
        const recolorCanvas = document.createElement('canvas');
        recolorCanvas.width = cropCanvas.width;
        recolorCanvas.height = cropCanvas.height;
        const rCtx = recolorCanvas.getContext('2d');
        rCtx.drawImage(cropCanvas, 0, 0);
        rCtx.globalCompositeOperation = 'source-in';
        rCtx.fillStyle = '#152238';
        rCtx.fillRect(0, 0, recolorCanvas.width, recolorCanvas.height);

        window.__finalSignatureDataURL = recolorCanvas.toDataURL();
        window.__finalSignatureAspectRatio = w / h;
        window.__finalSignatureSource = 'fullscreen';

        const displayWidth = canvas.width / (window.devicePixelRatio || 1);
        const displayHeight = canvas.height / (window.devicePixelRatio || 1);
        const scale = Math.min(displayWidth / w, displayHeight / h);
        ctx.clearRect(0, 0, displayWidth, displayHeight);
        ctx.drawImage(recolorCanvas, 0, 0, w * dpr, h * dpr,
                      (displayWidth - w * scale) / 2, (displayHeight - h * scale) / 2,
                      w * scale, h * scale);
      }
    } else if (source === 'normal') {
      const dpr = window.devicePixelRatio || 1;
      const displayWidth = canvas.width / dpr;
      const displayHeight = canvas.height / dpr;
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      let minX = canvas.width, maxX = 0, minY = canvas.height, maxY = 0;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
        if (a > 128 && r < 100 && g < 100 && b < 100) {
          const pixelIndex = i / 4;
          const x = pixelIndex % canvas.width;
          const y = Math.floor(pixelIndex / canvas.width);
          minX = Math.min(minX, x); maxX = Math.max(maxX, x);
          minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        }
      }
      if (minX <= maxX && minY <= maxY) {
        const w = Math.ceil((maxX - minX) / dpr);
        const h = Math.ceil((maxY - minY) / dpr);
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = w * dpr; cropCanvas.height = h * dpr;
        const cropCtx = cropCanvas.getContext('2d');
        cropCtx.drawImage(canvas, minX, minY, w * dpr, h * dpr, 0, 0, w * dpr, h * dpr);
        window.__finalSignatureDataURL = cropCanvas.toDataURL();
        window.__finalSignatureAspectRatio = w / h;
        window.__finalSignatureSource = 'normal';
      }
    }
  }

  closeBtn.addEventListener('click', exitFullscreenSignature);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && fsModal.classList.contains('active')) exitFullscreenSignature();
  });

  clearFsBtn.addEventListener('click', clearFullscreenPad);
  confirmFsBtn.addEventListener('click', () => {
    if (fsHasSignature) captureFinalSignature('fullscreen');
    exitFullscreenSignature();
  });

  window.addEventListener('load', initSignaturePad);
  window.addEventListener('resize', () => {
    if (!fsModal.classList.contains('active')) initSignaturePad();
  });
</script>
</body>
</html>

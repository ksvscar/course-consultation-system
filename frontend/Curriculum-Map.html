<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高雄高工課程地圖【汽車科】Curriculum Map V7</title>
<style>
:root{
  --color-general:#90EE90;
  --color-flex:#B0E0E6;
  --color-group:#D3D3D3;
  --color-professional:#87CEEB;
  --color-required:#FFFFE0;
  --color-skill:#F0E68C;
  --color-vehicle:#FFB6C1;
  --color-elective:#D7F5D0;
  --color-elective-container:#E0DFBE;
  --ink:#2b2b2b;
  --line:#9aa5ad;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);
  background:#f4f6f7;
  -webkit-tap-highlight-color:transparent;
}

/* ============ 頂欄（永不凸出） ============ */
.title-bar{
  background:linear-gradient(135deg,#dceefb,#eaf6ff);
  border:2px solid #5b9bd5;
  border-radius:10px;
  padding:14px 20px;
  text-align:center;
  margin:14px 14px 0;
}
.title-bar h1{margin:0;font-size:2rem;color:#1f5f91;}
.title-bar p{margin:8px 0 0;font-size:1.2rem;color:#4a4a4a;}

/* ============ 圖例區（純SVG嵌入，固定不變，純白底） ============ */
.legend-row{
  display:flex;
  gap:14px;
  margin:10px 14px 4px;
  align-items:flex-start;
  flex-wrap:wrap;
}
.legend-box{
  flex:1 1 320px;
  border:1px solid #c9d3d8;
  border-radius:8px;
  background:#ffffff;
  padding:8px;
}
.legend-box svg{display:block;width:100%;height:auto;background:#ffffff;}
.legend-box .legend-label{
  font-size:.78rem;
  color:#7a8288;
  margin:0 0 4px 2px;
}

/* ============ 版面 ============ */
.layout{
  display:grid;
  grid-template-columns:190px 1fr;
  gap:14px;
  padding:10px 14px 30px;
}

/* ============ 左側分類欄 ============ */
.side-nav{display:flex;flex-direction:column;gap:10px;}
.nav-item{
  border:2px solid var(--line);
  border-radius:8px;
  padding:14px 10px;
  text-align:center;
  font-weight:700;
  cursor:pointer;
  transition:transform .18s ease, box-shadow .18s ease;
  user-select:none;
}

/* ============ 主要內容區 ============ */
.main-panel{display:flex;flex-direction:column;gap:14px;}

/* 課程容器（可為分類或葉節點課程） */
.node{
  border:2px solid var(--line);
  border-radius:8px;
  transition:transform .18s ease, box-shadow .18s ease;
}
.node-header{
  padding:14px 16px;
  font-weight:700;
  cursor:pointer;
  border-radius:6px;
  user-select:none;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.node-children{
  display:grid;
  gap:10px;
  padding:12px;
  grid-template-columns:repeat(auto-fit, minmax(210px, 1fr));
}
.leaf{
  border:2px solid var(--line);
  border-radius:6px;
  padding:18px 16px;
  min-height:64px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  font-size:1.2rem;
  cursor:pointer;
  text-align:center;
  transition:transform .18s ease, box-shadow .18s ease;
  user-select:none;
  line-height:1.5;
}
.leaf .code{
  display:block;
  font-size:1rem;
  color:#555;
  font-weight:400;
  margin-bottom:4px;
}
.leaf .name{ font-weight:700; font-size:14px; }
.node-header{ font-size:1.35rem; }
.nav-item{ font-size:1.25rem; }

/* 群組排列：桌機用自動換欄，避免方塊過寬過扁 */

/* ============ 立體凸出效果（方案甲：陰影+上浮） ============ */
.layer-1{
  transform:translateY(-6px);
  box-shadow:0 10px 18px rgba(0,0,0,.22);
  z-index:3;
  position:relative;
}
.layer-2{
  transform:translateY(-9px);
  box-shadow:0 14px 24px rgba(0,0,0,.28);
  z-index:4;
  position:relative;
}
.layer-3{
  transform:translateY(-12px);
  box-shadow:0 18px 30px rgba(0,0,0,.34);
  z-index:5;
  position:relative;
}
.hover-self{
  transform:translateY(-5px);
  box-shadow:0 8px 14px rgba(0,0,0,.18);
}

/* ============ 手機版 Accordion（375-667px） ============ */
@media (max-width:768px){
  .layout{grid-template-columns:1fr;}
  .side-nav{
    flex-direction:row;
    flex-wrap:wrap;
  }
  .nav-item{flex:1 1 30%;padding:10px 6px;font-size:1rem;}
  .node-children{grid-template-columns:1fr;display:none;}
  .node.expanded > .node-children{display:grid;}
  .node-header::after{content:"▾";transition:transform .2s;}
  .node.expanded > .node-header::after{transform:rotate(180deg);}
  .legend-wrap svg{min-width:900px;}
}
</style>
</head>

const mainPanel = document.getElementById("mainPanel");
const sideNav   = document.getElementById("sideNav");

document.querySelector(".title-bar p").textContent = courseMapData.year + "學年入學新生適用";

function colorVar(c){ return `var(--color-${c || "elective"})`; }

function buildNode(node, depth){
  const hasChildren = node.children && node.children.length > 0;
  const wrap = document.createElement("div");
  wrap.dataset.id = node.id;

  if (Array.isArray(node.children)){
    wrap.className = "node";
    wrap.style.background = colorVar(node.color);
    const header = document.createElement("div");
    header.className = "node-header";
    header.textContent = node.name;
    header.style.background = colorVar(node.color);
    wrap.appendChild(header);

    const childWrap = document.createElement("div");
    childWrap.className = "node-children grid-" + Math.min(node.children.length, 3);
    node.children.forEach(child => childWrap.appendChild(buildNode(child, depth+1)));
    wrap.appendChild(childWrap);
  } else {
    wrap.className = "leaf";
    wrap.style.background = colorVar(node.color);
    const codeEl = document.createElement("span");
    codeEl.className = "code";
    codeEl.textContent = node.code || "";
    const nameEl = document.createElement("span");
    nameEl.className = "name";
    nameEl.textContent = node.name;
    wrap.appendChild(codeEl);
    wrap.appendChild(nameEl);
  }
  return wrap;
}

courseMapData.categories.forEach(cat=>{
  const catNode = buildNode(cat, 0);
  mainPanel.appendChild(catNode);

  if (cat.inNav){
    const navItem = document.createElement("div");
    navItem.className = "nav-item";
    navItem.textContent = cat.name.replace(/\s*\(.+\)$/,"");
    navItem.style.background = colorVar(cat.color);
    navItem.dataset.targetId = cat.id;
    sideNav.appendChild(navItem);
  }
});

/* =====================================================================
   互動邏輯：點擊 = 分層凸出 cascade；懸停 = 單一元素微凸
===================================================================== */
let activeId = null;

function clearAllLayers(){
  document.querySelectorAll(".layer-1,.layer-2,.layer-3")
    .forEach(el=>el.classList.remove("layer-1","layer-2","layer-3"));
  document.querySelectorAll(".node.expanded").forEach(el=>el.classList.remove("expanded"));
}

function applyCascade(rootEl){
  rootEl.classList.add("layer-1");
  rootEl.classList.add("expanded");

  const walk = (el, depth)=>{
    const childWrap = el.querySelector(":scope > .node-children");
    if(!childWrap) return;
    Array.from(childWrap.children).forEach(child=>{
      if (depth === 0){
        child.classList.add("layer-2");
      } else {
        child.classList.add("layer-3");
      }
      child.classList.add("expanded");
      walk(child, depth+1);
    });
  };
  walk(rootEl, 0);
}

function findElById(id){
  return document.querySelector(`[data-id="${id}"]`);
}

document.addEventListener("click", (e)=>{
  const navItem = e.target.closest(".nav-item");
  const header   = e.target.closest(".node-header");
  const leaf     = e.target.closest(".leaf");

  let targetEl = null;
  let targetId = null;

  if (navItem){
    targetId = navItem.dataset.targetId;
    targetEl = findElById(targetId);
  } else if (header){
    targetEl = header.closest(".node");
    targetId = targetEl.dataset.id;
  } else if (leaf){
    targetEl = leaf;
    targetId = leaf.dataset.id;
  } else {
    clearAllLayers();
    activeId = null;
    return;
  }

  if (activeId === targetId){
    clearAllLayers();
    activeId = null;
    return;
  }

  clearAllLayers();
  activeId = targetId;
  applyCascade(targetEl);

  let p = targetEl.parentElement;
  while(p){
    if (p.classList && p.classList.contains("node")) p.classList.add("expanded");
    p = p.parentElement;
  }
});

document.addEventListener("mouseover", (e)=>{
  const leaf = e.target.closest(".leaf");
  if (!leaf || leaf.classList.contains("layer-1") || leaf.classList.contains("layer-2") || leaf.classList.contains("layer-3")) return;
  leaf.classList.add("hover-self");
});
document.addEventListener("mouseout", (e)=>{
  const leaf = e.target.closest(".leaf");
  if (!leaf) return;
  leaf.classList.remove("hover-self");
});
</script>

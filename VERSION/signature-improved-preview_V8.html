<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>課程諮詢紀錄表 - 簽名測試</title>
<style>
  :root{
    --ink:#152238;
    --steel:#1E3A5F;
    --steel-deep:#0F2540;
    --steel-pale:#E8EEF5;
    --line:#D7E0EA;
    --signal:#FF5A1F;
    --signal-dim:#FFE7DB;
    --paper:#FBFAF7;
    --ok:#1E7A4C;
    --font-cjk: "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--steel-deep);font-family:var(--font-cjk);color:var(--ink);}
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    background:
      radial-gradient(circle at 20% -10%, #2A4C74 0%, transparent 45%),
      var(--steel-deep);
  }

  /* ============================================
     v8 修正 - Bug#3：iPad 兩側長條空白
     改用 clamp() 讓表單寬度依裝置視窗寬度動態調整，
     不再是固定 460px 死板上限，平板/大螢幕會依比例變寬，
     減少兩側浪費的空白。
     ============================================ */
  .device{
    width:100%;
    max-width: clamp(360px, 92vw, 820px);
    min-height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 60px rgba(0,0,0,.4);
  }

  /* ---- Header / progress ---- */
  header{
    background:linear-gradient(135deg, var(--steel-deep), var(--steel) 70%);
    color:#fff;
    padding:20px 20px 22px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; right:-30px; top:-30px;
    width:160px; height:160px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.08);
  }
  header::before{
    content:"";
    position:absolute; right:10px; top:40px;
    width:100px; height:100px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.06);
  }
  .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:#9FC1E0; font-weight:600; margin:0 0 4px; position:relative;
  }
  h1{
    font-size:19px; margin:0 0 14px; font-weight:700; line-height:1.4;
    position:relative;
  }
  .gauge-track{
    display:flex; gap:5px; position:relative;
  }
  .gauge-track i{
    flex:1; height:4px; border-radius:2px;
    background:rgba(255,255,255,.18);
    overflow:hidden;
  }
  .gauge-track i span{
    display:block; height:100%; width:0%;
    background:var(--signal);
    transition:width .4s ease;
  }
  .gauge-track i.done span{width:100%;}
  .gauge-track i.active span{width:55%;}
  .step-label{
    margin-top:8px; font-size:12px; color:#C9DCEE; letter-spacing:.02em; position:relative;
  }
  .step-label b{color:#fff;}

  /* ---- Body ---- */
  main{flex:1; padding:22px 20px 110px; overflow-y:auto;}

  .card{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:20px 18px; margin-bottom:16px;
  }

  .name-summary{
    font-size:14px; font-weight:700; color:var(--steel-deep); margin:0;
  }

  .warn-card{
    display:flex; gap:10px;
    background:var(--signal-dim); border:1px solid #FFCBB0; border-radius:12px;
    padding:14px 14px; margin-bottom:16px;
  }
  .warn-card .ic{
    width:26px; height:26px; border-radius:50%; background:var(--signal);
    color:#fff; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700;
  }
  .warn-card .txt{font-size:12.5px; color:#7A3A1E; line-height:1.6;}
  .warn-card .txt b{color:var(--steel-deep); display:block; margin-bottom:2px; font-size:13.5px;}
  .warn-card a{color:var(--steel); font-weight:700; text-decoration:none;}

  .sig-wrap{background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px;}

  .sig-label{
    font-size:14px; font-weight:700; color:var(--steel-deep);
    margin:0 0 12px; display:flex; justify-content:space-between; align-items:center;
  }
  .expand-btn{
    display:flex; align-items:center; gap:5px;
    background:#fff; border:1.5px solid var(--signal); color:var(--signal);
    border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:700;
    cursor:pointer; transition:.15s;
  }
  .expand-btn:hover:not(.hidden){background:var(--signal-dim);}
  .expand-btn.hidden{display:none;}

  .sig-canvas-container{
    position:relative;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:var(--steel-pale);
    overflow:hidden;
    margin-bottom:12px;
    display:flex; align-items:center; justify-content:center;
  }

  #signatureCanvas{
    width:100%; height:180px; display:block;
    touch-action:none; cursor:crosshair;
  }

  .btn-clear{
    width:100%;
    padding:11px; border-radius:10px; border:1.5px solid var(--line);
    background:#fff; color:#5C6C81; font-size:14px; font-weight:700;
    font-family:var(--font-cjk); cursor:pointer; transition:.15s;
  }
  .btn-clear:hover{background:var(--steel-pale);}

  .notice-card{
    background:var(--signal-dim); border:1px solid #FFCBB0; border-radius:12px;
    padding:13px 14px; margin-top:16px; font-size:12.5px; color:#7A3A1E; line-height:1.7;
  }
  .notice-card b{color:var(--steel-deep);}

  .cta-bar{
    position:sticky; left:0; right:0; bottom:0;
    background:linear-gradient(0deg, var(--paper) 60%, rgba(251,250,247,0));
    padding:16px 20px 16px; display:flex; gap:8px;
  }
  .btn{
    flex:1; padding:11px; border-radius:10px; border:none;
    font-size:14px; font-weight:700; font-family:var(--font-cjk); cursor:pointer;
  }
  .btn-prev{background:#fff; border:1.5px solid var(--line); color:#5C6C81; flex:0 0 78px;}
  .btn-next{
    background:var(--signal); color:#fff;
    box-shadow:0 6px 14px rgba(255,90,31,.3);
  }
  .btn-next:active{transform:translateY(1px);}

  /* ---- 全螢幕簽名 Modal（純 CSS 模擬，無原生 Fullscreen API） ---- */
  .fullscreen-modal{
    display:none;
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:#0A0A0A;
    z-index:10000;
    padding:0;
    overflow:hidden;
  }
  .fullscreen-modal.active{display:block;}

  .fullscreen-canvas-container{
    position:absolute;
    top:0; left:0; right:0;
    height:calc(100% - 64px);
    box-sizing:border-box;
    border:2px solid #FFFFFF;
    background:#000;
    overflow:hidden;
  }

  #fullscreenPad{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    display:block;
    background:transparent;
    cursor:crosshair;
    touch-action:none;
    z-index:1;
  }

  .signature-watermark{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    font-size:80px;
    font-weight:bold;
    color:rgba(200,200,200,0.35);
    pointer-events:none;
    z-index:0;
    font-family:Arial,"Noto Sans TC",sans-serif;
    white-space:nowrap;
    user-select:none;
    -webkit-user-select:none;
  }

  .fs-button-group{
    position:absolute;
    bottom:8px; left:50%;
    transform:translateX(-50%);
    display:flex; gap:10px; z-index:10001;
  }
  .btn-clear-fs, .btn-confirm-fs{
    padding:9px 16px; font-size:13px; border:none; border-radius:8px;
    cursor:pointer; font-weight:700; font-family:var(--font-cjk); transition:.15s;
  }
  .btn-clear-fs{background:#fff; color:var(--steel-deep);}
  .btn-clear-fs:hover{background:#eee;}
  .btn-confirm-fs{background:var(--signal); color:#fff;}
  .btn-confirm-fs:hover{background:#e64f18;}

  .close-btn{
    position:absolute;
    top:8px; right:8px;
    background:rgba(255,255,255,.15); color:#fff;
    border:2px solid rgba(255,255,255,.7); border-radius:50%;
    width:36px; height:36px; font-size:18px; cursor:pointer;
    z-index:10002; transition:.15s; display:flex; align-items:center; justify-content:center;
  }
  .close-btn:hover{background:rgba(255,255,255,.3);}

  ::selection{background:var(--signal-dim);}
</style>
</head>
<body>
<div class="device">

  <header>
    <p class="eyebrow">114 學年度 · 高一上學期</p>
    <h1>團體課程諮詢紀錄表</h1>
    <div class="gauge-track">
      <i class="done"><span></span></i>
      <i class="done"><span></span></i>
      <i class="done"><span></span></i>
      <i class="done"><span></span></i>
      <i class="active"><span></span></i>
    </div>
    <p class="step-label">第 <b>5</b> / 5 步 · 確認並簽名</p>
  </header>

  <main>
    <div class="card">
      <p class="name-summary">簽名人：陳怡安</p>
    </div>

    <div class="warn-card">
      <div class="ic">!</div>
      <div class="txt">
        <b>課程地圖說明</b>
        點此觀看《114課程地圖【汽車科】》說明影片
        (Edcafe AI)
        <br>課程地圖影片連結尚未提供，敬請期待
      </div>
    </div>

    <div class="sig-wrap">
      <div class="sig-label">
        <span>本人簽名</span>
        <button class="expand-btn" id="expandHintBtn" type="button">
          🔍 點擊放大簽名
        </button>
      </div>

      <div class="sig-canvas-container">
        <canvas id="signatureCanvas" width="300" height="120"></canvas>
      </div>

      <button class="btn-clear" type="button" id="clearBtn">清空重簽</button>
    </div>

    <div class="notice-card">
      送出後將先不要關閉此頁面，待考老師核可完成後畫面會自動顯示「完成」按鈕。
    </div>
  </main>

  <div class="cta-bar">
    <button class="btn btn-prev" type="button">上一步</button>
    <button class="btn btn-next" type="button" id="submitBtn">送出紀錄表</button>
  </div>

  <div class="fullscreen-modal" id="fullscreenModal">
    <div class="fullscreen-canvas-container">
      <canvas id="fullscreenPad"></canvas>
      <div class="signature-watermark" id="fullscreenWatermark">簽名</div>
    </div>
    <div class="fs-button-group">
      <button class="btn-clear-fs" id="clearFsBtn" type="button">清空重簽</button>
      <button class="btn-confirm-fs" id="confirmFsBtn" type="button">✓ 確認簽名(橫式)</button>
    </div>
    <button class="close-btn" id="closeBtn" type="button" title="關閉（ESC）">✕</button>
  </div>

</div>

<script>
  const PEN_VISUAL_WIDTH_PX = 2.5;
  const STUDENT_NAME = '陳怡安';

  /* ============================================
     v8：簽名者角色 + 生物特徵擷取基礎架構
     ------------------------------------------------
     簽名真偽比對的技術原理：
       - 一般簽名只留下「最終圖案」，容易被單純描摹複製。
       - 若額外記錄「筆畫順序 + 每個點的時間戳記」，就構成
         業界所稱的「動態簽名生物特徵」(Dynamic/Online Signature
         Biometrics)，比對時可分析下筆順序、速度、停頓等，
         比單純比對圖形更難偽造。
       - 這裡的 fsStrokes / normalStrokes 本身已經是「筆畫順序」
         的向量資料，v8 額外加上每個點的時間戳記 t，
         之後只要把 window.__signatureBiometricData 傳到後端
         資料庫存起來，未來就能用動態時間校準（DTW）等演算法
         比對新簽名與歷史簽名是否為同一人所寫。
       - 目前後端（NAS/Docker）尚未建置，這裡先建立好「擷取」
         這一端的資料格式，之後接上後端即可直接使用。
       - 依需求：老師簽名不需要這層驗證，只有學生/家長需要。
     ============================================ */
  const SIGNER_ROLE = 'student'; // 'student' | 'parent' | 'teacher'（未來可由頁面/表單參數帶入）
  const ENABLE_BIOMETRIC_CAPTURE = (SIGNER_ROLE === 'student' || SIGNER_ROLE === 'parent');

  function nowTs() {
    return (window.performance && performance.now) ? performance.now() : Date.now();
  }

  /* ============================================
     向量筆跡工具（v8：改成「絕對座標 + 等比例縮放置中」）
     ------------------------------------------------
     v7 用的是「相對比例 (x/寬度, y/高度)」重繪，旋轉時寬高比
     劇烈改變會讓筆跡被分別在 X、Y 軸用不同倍率拉伸，造成變形。
     v8 改成：記錄「目前畫布尺寸下的絕對座標」，每次要重繪前，
     用「等比例縮放 + 置中」(對應圖片的 contain 模式) 把舊座標
     換算到新畫布尺寸，形狀比例永遠不會跑掉，只是整體變大或縮小。
     ============================================ */
  function redrawStrokesAbsolute(strokes, ctxRef, color) {
    if (!strokes || !strokes.length) return;
    ctxRef.strokeStyle = color;
    ctxRef.lineWidth = PEN_VISUAL_WIDTH_PX;
    ctxRef.lineCap = 'round';
    ctxRef.lineJoin = 'round';
    strokes.forEach(stroke => {
      if (!stroke || stroke.length < 2) return;
      ctxRef.beginPath();
      ctxRef.moveTo(stroke[0].x, stroke[0].y);
      for (let i = 1; i < stroke.length; i++) {
        ctxRef.lineTo(stroke[i].x, stroke[i].y);
      }
      ctxRef.stroke();
    });
  }

  function remapStrokesOnResize(strokes, oldW, oldH, newW, newH) {
    if (!oldW || !oldH || !strokes || !strokes.length) return;
    const scale = Math.min(newW / oldW, newH / oldH); // 等比例縮放（不變形）
    const offsetX = (newW - oldW * scale) / 2;
    const offsetY = (newH - oldH * scale) / 2;
    strokes.forEach(stroke => {
      stroke.forEach(pt => {
        pt.x = pt.x * scale + offsetX;
        pt.y = pt.y * scale + offsetY;
      });
    });
  }

  // ========== 正常（原始版）簽名畫布 ==========
  const canvas = document.getElementById('signatureCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const expandBtn = document.getElementById('expandHintBtn');
  const clearBtn = document.getElementById('clearBtn');

  let drawing = false;
  let hasSignature = false;
  let last = { x: 0, y: 0 };
  let normalStrokes = [];
  let currentNormalStroke = null;
  let normalRefW = 0, normalRefH = 0;

  // v8：記住「最終確認簽名」的圖像來源，讓旋轉/捲動時能還原，不會被誤畫成提示字
  let finalSignatureSourceCanvas = null;
  let finalSignatureCssW = 0;
  let finalSignatureCssH = 0;

  function drawGhostText() {
    const width = canvas.width / (window.devicePixelRatio || 1);
    const height = canvas.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#B9C7D8';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const targetWidth = width * 0.85;
    let fontSize = Math.min(height * 0.7, 100);
    ctx.font = `bold ${fontSize}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;
    let measured = ctx.measureText(STUDENT_NAME).width;
    if (measured > 0) {
      fontSize = fontSize * (targetWidth / measured);
      fontSize = Math.min(fontSize, height * 0.75);
      ctx.font = `bold ${fontSize}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;
    }

    ctx.fillText(STUDENT_NAME, width / 2, height / 2);
  }

  function canvasPos(canvas, e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function paintFinalSignatureOntoSmallCanvas() {
    if (!finalSignatureSourceCanvas) return;
    const dpr = window.devicePixelRatio || 1;
    const displayWidth = canvas.width / dpr;
    const displayHeight = canvas.height / dpr;
    const w = finalSignatureCssW, h = finalSignatureCssH;
    if (!w || !h) return;
    const scale = Math.min(displayWidth / w, displayHeight / h);
    ctx.clearRect(0, 0, displayWidth, displayHeight);
    ctx.drawImage(
      finalSignatureSourceCanvas,
      0, 0, finalSignatureSourceCanvas.width, finalSignatureSourceCanvas.height,
      (displayWidth - w * scale) / 2, (displayHeight - h * scale) / 2,
      w * scale, h * scale
    );
  }

  /**
   * mode: 'ghost'  -> 清空畫水印提示字（清空重簽 / 首次載入）
   *       'resize' -> 視窗大小改變（旋轉/捲動觸發），依優先序還原內容
   */
  function initSignaturePad(mode) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const oldW = normalRefW, oldH = normalRefH;

    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    const cssWidth = rect.width;
    const cssHeight = rect.height;

    if (mode === 'resize') {
      if (normalStrokes.length) {
        // 情境 A：使用者正在原始版畫布上直接簽名，旋轉時優先還原向量筆跡
        remapStrokesOnResize(normalStrokes, oldW, oldH, cssWidth, cssHeight);
        ctx.clearRect(0, 0, cssWidth, cssHeight);
        redrawStrokesAbsolute(normalStrokes, ctx, '#152238');
        hasSignature = true;
        expandBtn.classList.add('hidden');
      } else if (finalSignatureSourceCanvas) {
        // 情境 B：剛從放大版確認完簽名，旋轉/捲動時還原最終簽名圖（v8 修正重點）
        paintFinalSignatureOntoSmallCanvas();
        hasSignature = true;
        expandBtn.classList.add('hidden');
      } else {
        drawGhostText();
        hasSignature = false;
      }
    } else {
      drawGhostText();
      hasSignature = false;
    }

    normalRefW = cssWidth;
    normalRefH = cssHeight;

    canvas.onpointerdown = e => {
      drawing = true;
      last = canvasPos(canvas, e);
      canvas.setPointerCapture(e.pointerId);
      if (!hasSignature) {
        expandBtn.classList.add('hidden');
        hasSignature = true;
      }
      // 一旦使用者重新在原始版落筆，代表要蓋掉舊的「最終簽名圖」
      finalSignatureSourceCanvas = null;
      const pt = { x: last.x, y: last.y };
      if (ENABLE_BIOMETRIC_CAPTURE) pt.t = nowTs();
      currentNormalStroke = [pt];
      normalStrokes.push(currentNormalStroke);
    };

    canvas.onpointermove = e => {
      if (!drawing) return;
      const p = canvasPos(canvas, e);
      ctx.strokeStyle = '#152238';
      ctx.lineWidth = PEN_VISUAL_WIDTH_PX;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      last = p;
      const pt = { x: p.x, y: p.y };
      if (ENABLE_BIOMETRIC_CAPTURE) pt.t = nowTs();
      currentNormalStroke.push(pt);
    };

    const stopDrawing = () => {
      if (!drawing) return;
      drawing = false;
      captureFinalSignature('normal');
    };

    canvas.onpointerup = stopDrawing;
    canvas.onpointercancel = stopDrawing;
    canvas.onpointerleave = stopDrawing;
    window.addEventListener('pointerup', stopDrawing);
  }

  clearBtn.addEventListener('click', () => {
    drawing = false;
    hasSignature = false;
    normalStrokes = [];
    currentNormalStroke = null;
    finalSignatureSourceCanvas = null;
    expandBtn.classList.remove('hidden');
    drawGhostText();
    window.__finalSignatureDataURL = null;
    window.__signatureBiometricData = null;
  });

  expandBtn.addEventListener('click', enterFullscreenSignature);

  // ========== 全螢幕簽名（放大版）==========
  const fsModal = document.getElementById('fullscreenModal');
  const fsPad = document.getElementById('fullscreenPad');
  const fsCtx = fsPad.getContext('2d', { willReadFrequently: true });
  const closeBtn = document.getElementById('closeBtn');
  const clearFsBtn = document.getElementById('clearFsBtn');
  const confirmFsBtn = document.getElementById('confirmFsBtn');

  let fsDrawing = false;
  let fsHasSignature = false;
  let fsLast = { x: 0, y: 0 };
  let fsResizeHandlerBound = false;
  let fsStrokes = [];
  let currentFsStroke = null;
  let fsRefW = 0, fsRefH = 0;

  function getDynamicBorderWidth() {
    const shorterSide = Math.min(window.innerWidth, window.innerHeight);
    const dpr = window.devicePixelRatio;
    let borderWidth;
    if (shorterSide < 600) borderWidth = 2.0;
    else if (shorterSide < 900) borderWidth = 2.5;
    else if (shorterSide < 1200) borderWidth = 2.8;
    else if (shorterSide < 1500) borderWidth = 3.0;
    else if (shorterSide < 2000) borderWidth = 3.2;
    else borderWidth = 3.5;
    if (dpr > 2) borderWidth = borderWidth * 0.9;
    return Math.max(1.5, Math.min(borderWidth, 4.0));
  }

  /**
   * v8 修正：浮水印字太小的問題。
   * 舊版只用「屏幕短邊 × 固定百分比」，沒考慮姓名實際文字寬度，
   * 中文姓名字數少時看起來就偏小。
   * 新版改成跟原始版 drawGhostText() 一樣的做法：
   * 用 canvas.measureText() 實際量測文字寬度，
   * 反推字級讓文字寬度佔容器寬度約 72%，並用容器高度做上限保護。
   */
  function computeWatermarkFontSize(containerW, containerH, text) {
    const targetWidth = containerW * 0.72;
    const measureCanvas = computeWatermarkFontSize._c || (computeWatermarkFontSize._c = document.createElement('canvas'));
    const mctx = measureCanvas.getContext('2d');
    let fontSize = Math.min(containerH * 0.55, 400);
    mctx.font = `bold ${fontSize}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;
    let measured = mctx.measureText(text).width;
    if (measured > 0) {
      fontSize = fontSize * (targetWidth / measured);
      fontSize = Math.min(fontSize, containerH * 0.6);
    }
    return Math.max(32, Math.round(fontSize));
  }

  function applyDynamicStyles() {
    const borderWidth = getDynamicBorderWidth();
    const container = document.querySelector('.fullscreen-canvas-container');
    if (container) container.style.borderWidth = borderWidth + 'px';

    const watermark = document.querySelector('.signature-watermark');
    if (container && watermark) {
      const cW = container.clientWidth;
      const cH = container.clientHeight;
      const fontSize = computeWatermarkFontSize(cW, cH, STUDENT_NAME);
      watermark.style.fontSize = fontSize + 'px';
    }
  }

  function sizeFullscreenCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const rect = fsPad.getBoundingClientRect();
    fsPad.width = Math.max(1, Math.round(rect.width * dpr));
    fsPad.height = Math.max(1, Math.round(rect.height * dpr));
    fsCtx.setTransform(1, 0, 0, 1, 0, 0);
    fsCtx.scale(dpr, dpr);
    return { cssWidth: rect.width, cssHeight: rect.height };
  }

  /**
   * preserve = true：旋轉 / resize 時呼叫，保留並等比例重繪筆跡
   * preserve = false：第一次開啟全螢幕時呼叫，畫布清空
   */
  function initFullscreenSignature(preserve) {
    const oldW = fsRefW, oldH = fsRefH;
    const { cssWidth, cssHeight } = sizeFullscreenCanvas();

    fsCtx.clearRect(0, 0, cssWidth, cssHeight);

    if (preserve && fsStrokes.length) {
      remapStrokesOnResize(fsStrokes, oldW, oldH, cssWidth, cssHeight);
      redrawStrokesAbsolute(fsStrokes, fsCtx, '#FFFFFF');
      fsHasSignature = true;
    } else {
      fsHasSignature = false;
    }

    fsRefW = cssWidth;
    fsRefH = cssHeight;

    fsPad.onpointerdown = e => {
      fsDrawing = true;
      const rect = fsPad.getBoundingClientRect();
      fsLast = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      fsPad.setPointerCapture(e.pointerId);
      fsHasSignature = true;
      const pt = { x: fsLast.x, y: fsLast.y };
      if (ENABLE_BIOMETRIC_CAPTURE) pt.t = nowTs();
      currentFsStroke = [pt];
      fsStrokes.push(currentFsStroke);
    };

    fsPad.onpointermove = e => {
      if (!fsDrawing) return;
      const rect = fsPad.getBoundingClientRect();
      const p = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      fsCtx.strokeStyle = '#FFFFFF';
      fsCtx.lineWidth = PEN_VISUAL_WIDTH_PX;
      fsCtx.lineCap = 'round';
      fsCtx.lineJoin = 'round';
      fsCtx.beginPath();
      fsCtx.moveTo(fsLast.x, fsLast.y);
      fsCtx.lineTo(p.x, p.y);
      fsCtx.stroke();
      fsLast = p;
      const pt = { x: p.x, y: p.y };
      if (ENABLE_BIOMETRIC_CAPTURE) pt.t = nowTs();
      currentFsStroke.push(pt);
    };

    const stopFsDrawing = () => { fsDrawing = false; };
    fsPad.onpointerup = stopFsDrawing;
    fsPad.onpointercancel = stopFsDrawing;
    fsPad.onpointerleave = stopFsDrawing;
  }

  function enterFullscreenSignature() {
    fsModal.classList.add('active');

    if (!fsResizeHandlerBound) {
      window.addEventListener('orientationchange', () => {
        if (!fsModal.classList.contains('active')) return;
        setTimeout(() => {
          applyDynamicStyles();
          initFullscreenSignature(true);
        }, 350);
      });
      window.addEventListener('resize', () => {
        if (!fsModal.classList.contains('active')) return;
        setTimeout(() => {
          applyDynamicStyles();
          initFullscreenSignature(true);
        }, 150);
      });
      fsResizeHandlerBound = true;
    }

    fsStrokes = [];
    currentFsStroke = null;
    fsRefW = 0; fsRefH = 0;

    setTimeout(() => {
      applyDynamicStyles();
      initFullscreenSignature(false);
    }, 50);

    const watermarkEl = document.getElementById('fullscreenWatermark');
    if (watermarkEl) watermarkEl.textContent = STUDENT_NAME;
  }

  function exitFullscreenSignature() {
    fsModal.classList.remove('active');
    fsStrokes = [];
    currentFsStroke = null;
  }

  function clearFullscreenPad() {
    const dpr = window.devicePixelRatio || 1;
    fsCtx.clearRect(0, 0, fsPad.width / dpr, fsPad.height / dpr);
    fsHasSignature = false;
    fsDrawing = false;
    fsStrokes = [];
    currentFsStroke = null;
  }

  function captureFinalSignature(source) {
    if (source === 'fullscreen') {
      const dpr = window.devicePixelRatio || 1;
      const imageData = fsCtx.getImageData(0, 0, fsPad.width, fsPad.height);
      const data = imageData.data;
      let minX = fsPad.width, maxX = 0, minY = fsPad.height, maxY = 0;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
        if (a > 128 && r > 200 && g > 200 && b > 200) {
          const pixelIndex = i / 4;
          const x = pixelIndex % fsPad.width;
          const y = Math.floor(pixelIndex / fsPad.width);
          minX = Math.min(minX, x); maxX = Math.max(maxX, x);
          minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        }
      }
      if (minX <= maxX && minY <= maxY) {
        const w = Math.ceil((maxX - minX) / dpr);
        const h = Math.ceil((maxY - minY) / dpr);
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = w * dpr; cropCanvas.height = h * dpr;
        const cropCtx = cropCanvas.getContext('2d');
        cropCtx.drawImage(fsPad, minX, minY, w * dpr, h * dpr, 0, 0, w * dpr, h * dpr);

        const recolorCanvas = document.createElement('canvas');
        recolorCanvas.width = cropCanvas.width;
        recolorCanvas.height = cropCanvas.height;
        const rCtx = recolorCanvas.getContext('2d');
        rCtx.drawImage(cropCanvas, 0, 0);
        rCtx.globalCompositeOperation = 'source-in';
        rCtx.fillStyle = '#152238';
        rCtx.fillRect(0, 0, recolorCanvas.width, recolorCanvas.height);

        window.__finalSignatureDataURL = recolorCanvas.toDataURL();
        window.__finalSignatureAspectRatio = w / h;
        window.__finalSignatureSource = 'fullscreen';

        const displayWidth = canvas.width / (window.devicePixelRatio || 1);
        const displayHeight = canvas.height / (window.devicePixelRatio || 1);
        const scale = Math.min(displayWidth / w, displayHeight / h);
        ctx.clearRect(0, 0, displayWidth, displayHeight);
        ctx.drawImage(recolorCanvas, 0, 0, w * dpr, h * dpr,
                      (displayWidth - w * scale) / 2, (displayHeight - h * scale) / 2,
                      w * scale, h * scale);

        // v8 關鍵修正：記住這張最終簽名圖，往後原始版旋轉/捲動時優先還原它
        finalSignatureSourceCanvas = recolorCanvas;
        finalSignatureCssW = w;
        finalSignatureCssH = h;
        normalStrokes = [];
        currentNormalStroke = null;

        if (ENABLE_BIOMETRIC_CAPTURE) {
          window.__signatureBiometricData = {
            role: SIGNER_ROLE,
            source: 'fullscreen',
            capturedAt: Date.now(),
            strokes: fsStrokes  // 每筆含 x,y,t（相對於簽名當下的畫布座標與時間）
          };
        }
      }
    } else if (source === 'normal') {
      const dpr = window.devicePixelRatio || 1;
      const displayWidth = canvas.width / dpr;
      const displayHeight = canvas.height / dpr;
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      let minX = canvas.width, maxX = 0, minY = canvas.height, maxY = 0;
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
        if (a > 128 && r < 100 && g < 100 && b < 100) {
          const pixelIndex = i / 4;
          const x = pixelIndex % canvas.width;
          const y = Math.floor(pixelIndex / canvas.width);
          minX = Math.min(minX, x); maxX = Math.max(maxX, x);
          minY = Math.min(minY, y); maxY = Math.max(maxY, y);
        }
      }
      if (minX <= maxX && minY <= maxY) {
        const w = Math.ceil((maxX - minX) / dpr);
        const h = Math.ceil((maxY - minY) / dpr);
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = w * dpr; cropCanvas.height = h * dpr;
        const cropCtx = cropCanvas.getContext('2d');
        cropCtx.drawImage(canvas, minX, minY, w * dpr, h * dpr, 0, 0, w * dpr, h * dpr);
        window.__finalSignatureDataURL = cropCanvas.toDataURL();
        window.__finalSignatureAspectRatio = w / h;
        window.__finalSignatureSource = 'normal';

        // 直接在原始版簽名時，也同步記錄最終圖（防止極端情況下向量資料遺失時仍有備援）
        finalSignatureSourceCanvas = cropCanvas;
        finalSignatureCssW = w;
        finalSignatureCssH = h;

        if (ENABLE_BIOMETRIC_CAPTURE) {
          window.__signatureBiometricData = {
            role: SIGNER_ROLE,
            source: 'normal',
            capturedAt: Date.now(),
            strokes: normalStrokes
          };
        }
      }
    }
  }

  closeBtn.addEventListener('click', exitFullscreenSignature);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && fsModal.classList.contains('active')) exitFullscreenSignature();
  });

  clearFsBtn.addEventListener('click', clearFullscreenPad);
  confirmFsBtn.addEventListener('click', () => {
    if (fsHasSignature) captureFinalSignature('fullscreen');
    fsStrokes = [];
    currentFsStroke = null;
    exitFullscreenSignature();
  });

  window.addEventListener('load', () => initSignaturePad('ghost'));
  window.addEventListener('resize', () => {
    if (!fsModal.classList.contains('active')) initSignaturePad('resize');
  });
</script>
</body>
</html>
